name: Build Miatoll Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0bfbb-customkernel1
      - arena/01a1039d-customkernel1
    paths:
      - ".github/workflows/build-miatoll.yml"
      - "AnyKernel3/**"
      - "arch/**"
      - "block/**"
      - "certs/**"
      - "crypto/**"
      - "drivers/**"
      - "firmware/**"
      - "fs/**"
      - "include/**"
      - "init/**"
      - "ipc/**"
      - "kernel/**"
      - "lib/**"
      - "mm/**"
      - "net/**"
      - "scripts/**"
      - "security/**"
      - "sound/**"
      - "techpack/**"
      - "usr/**"
      - "virt/**"
      - "Makefile"
      - "Kbuild"
      - "Kconfig"

permissions:
  contents: read

concurrency:
  group: miatoll-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  DEFCONFIG: vendor/xiaomi/miatoll_defconfig

jobs:
  build:
    name: Compile and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison ccache clang flex git kmod libelf-dev libc6-dev lld llvm make \
            libssl-dev python3 rsync zip

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: miatoll-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            miatoll-ccache-${{ runner.os }}-

      - name: Verify LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Toolchain source: Ubuntu 24.04 LLVM"
            clang --version
            ld.lld --version
            llvm-ar --version
            llvm-nm --version
            llvm-objcopy --version
            for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
              command -v "$tool"
            done
          } | tee toolchain-info.txt

      - name: Generate and verify Miatoll configuration
        shell: bash
        run: |
          set -euo pipefail

          # Reject duplicate config symbols first. kconfig applies lines in
          # order and the LAST one wins, so a stale trailing "is not set"
          # silently defeats an earlier "=y" (this already happened twice:
          # ZSMALLOC_STAT, and EXT4_ENCRYPTION/NETFILTER_XT_TARGET_TRACE).
          #
          # $DEFCONFIG is a kconfig *target* name ("vendor/xiaomi/..."); make
          # resolves it under arch/$ARCH/configs/, so spell that out here -
          # reading the bare name as a path is what broke build #102.
          DEFCONFIG_PATH="arch/$ARCH/configs/$DEFCONFIG"
          test -f "$DEFCONFIG_PATH"

          awk '
            /^CONFIG_[A-Za-z0-9_]+=/ || /^# CONFIG_[A-Za-z0-9_]+ is not set/ {
              n = $0
              sub(/^# /, "", n); sub(/=.*/, "", n); sub(/ is not set/, "", n)
              cnt[n]++; line[n] = line[n] " " NR
            }
            END {
              bad = 0
              for (s in cnt)
                if (cnt[s] > 1) { print "DUPLICATE (" cnt[s] "x): " s " at lines" line[s]; bad++ }
              print "duplicate config symbols: " bad + 0
              exit (bad > 0)
            }
          ' "$DEFCONFIG_PATH"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- "$DEFCONFIG"

          require_config() {
            grep -qx "$1" out/.config || {
              echo "Required configuration missing: $1" >&2
              exit 1
            }
          }

          require_config 'CONFIG_KSU=y'
          if grep -q '^CONFIG_KSU_KPROBES_KSUD=y' out/.config; then
            echo 'Kprobe hooks must remain disabled for manual integration' >&2
            exit 1
          fi
          require_config '# CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set'
          require_config '# CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set'
          require_config 'CONFIG_KSU_LSM_SECURITY_HOOKS=y'
          require_config 'CONFIG_KSU_SUSFS=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_PATH=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_MOUNT=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_KSTAT=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_MAP=y'
          require_config 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y'
          require_config 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y'
          require_config 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y'
          require_config 'CONFIG_NOMOUNT=y'
          # Android 17 / AOSP userspace parity: the gate for Android 16+ on
          # non-GKI 4.14 is the newer eBPF feature set. These must stay on.
          require_config 'CONFIG_BPF_LSM=y'
          # BPF_STREAM_PARSER must stay off until net/core/skmsg.c is ported
          # properly; it does not compile in this tree (sk_psock_init()'s
          # 'prot' is undeclared) and that broke build #103.
          require_config '# CONFIG_BPF_STREAM_PARSER is not set'
          require_config 'CONFIG_BPF_JIT_ALWAYS_ON=y'
          require_config 'CONFIG_BPF_UNPRIV_DEFAULT_OFF=y'
          require_config 'CONFIG_PSI=y'
          require_config '# CONFIG_PSI_DEFAULT_DISABLED is not set'
          require_config 'CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"'
          require_config 'CONFIG_SECURITY_SELINUX_BOOTPARAM=y'
          require_config 'CONFIG_SECURITY_SELINUX_DEVELOP=y'
          # #107: USER_NS went out with the Droidspaces fragment - it is
          # asserted off in the container block below.
          require_config 'CONFIG_SECCOMP_FILTER=y'
          require_config 'CONFIG_DM_VERITY=y'
          require_config 'CONFIG_DM_DEFAULT_KEY=y'
          require_config 'CONFIG_FS_VERITY=y'
          require_config 'CONFIG_INCREMENTAL_FS=y'
          require_config 'CONFIG_QUOTA=y'
          require_config 'CONFIG_SCHED_WALT=y'
          require_config 'CONFIG_MEMCG=y'
          # These were silently disabled by a duplicate trailing "is not set".
          require_config 'CONFIG_EXT4_ENCRYPTION=y'
          require_config 'CONFIG_FS_ENCRYPTION=y'
          require_config 'CONFIG_NETFILTER_XT_TARGET_TRACE=y'
          # #106/#107 slim pass: the custom network tuner is gone and CUBIC
          # is the only congestion control left. Defaults are stock
          # (CUBIC + pfifo_fast); fq_codel/fq remain compiled in for tc.
          require_config '# CONFIG_TCP_CONG_BBR is not set'
          require_config '# CONFIG_TCP_CONG_BIC is not set'
          require_config '# CONFIG_TCP_CONG_WESTWOOD is not set'
          require_config '# CONFIG_TCP_CONG_HTCP is not set'
          require_config '# CONFIG_TCP_CONG_VEGAS is not set'
          require_config 'CONFIG_DEFAULT_TCP_CONG="cubic"'
          require_config '# CONFIG_NET_SCH_DEFAULT is not set'
          require_config 'CONFIG_NET_SCH_FQ_CODEL=y'
          # #107 slim pass: MGLRU is deleted from the source tree, so the
          # LRU_GEN symbols no longer exist in Kconfig - olddefconfig emits
          # no line for them. Any LRU_GEN text here means the revert did
          # not land.
          if grep -q 'LRU_GEN' out/.config; then
            echo 'MGLRU must be gone from .config (#107)' >&2
            exit 1
          fi
          # #106/#107: the Droidspaces/container fragment is gone entirely.
          require_config '# CONFIG_SYSVIPC is not set'
          require_config '# CONFIG_POSIX_MQUEUE is not set'
          require_config '# CONFIG_USER_NS is not set'
          require_config '# CONFIG_PID_NS is not set'
          require_config '# CONFIG_CGROUP_PIDS is not set'
          require_config '# CONFIG_CGROUP_DEVICE is not set'
          require_config '# CONFIG_CGROUP_NET_PRIO is not set'
          require_config '# CONFIG_BRIDGE_NETFILTER is not set'
          require_config '# CONFIG_NF_TABLES is not set'
          require_config '# CONFIG_NETFILTER_XT_MATCH_ADDRTYPE is not set'
          require_config '# CONFIG_DEVTMPFS is not set'
          require_config '# CONFIG_KPROBES is not set'
          require_config 'CONFIG_EROFS_FS=y'
          require_config 'CONFIG_EROFS_FS_ZIP=y'
          require_config 'CONFIG_EROFS_FS_SECURITY=y'
          require_config 'CONFIG_NTFS_FS=y'
          require_config 'CONFIG_NTFS_RW=y'
          require_config 'CONFIG_BPF_SYSCALL=y'
          require_config 'CONFIG_BPF_JIT=y'
          require_config 'CONFIG_CGROUP_BPF=y'
          require_config '# CONFIG_MODULE_SIG_FORCE is not set'

      - name: Build kernel, DTB, DTBO and modules
        shell: bash
        run: |
          set -euo pipefail
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.cache/ccache"
          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=kernel-ci
          ccache --max-size=5G

          set +e
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC='ccache clang' CROSS_COMPILE=aarch64-linux-gnu- \
            >build.log 2>&1
          build_status=$?
          set -e

          if [ "$build_status" -ne 0 ]; then
            echo 'Kernel build failed. Relevant diagnostics:'
            awk 'BEGIN{f=0; n=0} /error:/ { f=1 } f { print; n++ } n>=45 { exit }' build.log \
              | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/^/::error::/' || true
            tail -n 300 build.log
            exit "$build_status"
          fi

          tail -n 100 build.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-build-failure-${{ github.run_number }}
          path: |
            build.log
            toolchain-info.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish failure excerpt to job summary
        if: failure()
        shell: bash
        run: |
          {
            echo '## Build failure excerpt'
            echo '```'
            grep -n -B3 -A12 -m 30 'error:' build.log 2>/dev/null || tail -n 120 build.log 2>/dev/null || echo '(build.log missing)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Verify build products and KernelSU linkage
        shell: bash
        run: |
          set -euo pipefail

          test -s out/arch/arm64/boot/Image.gz
          test -s out/arch/arm64/boot/dtb.img
          test -s out/arch/arm64/boot/dtbo.img
          test -s out/arch/arm64/boot/dts/qcom/curtana-atoll-ab-idp-overlay.dtbo
          test -s out/drivers/kernelsu/ksu.o
          test -s out/fs/susfs.o
          test -s out/fs/nomount/nomount.o

          # Write once instead of piping llvm-nm into grep -q: with pipefail,
          # grep's early exit makes llvm-nm report EPIPE (exit 74).
          llvm-nm out/vmlinux > vmlinux.sym
          grep -q ' ksu_handle_execveat$' vmlinux.sym
          grep -q ' ksu_handle_sys_reboot$' vmlinux.sym
          grep -q ' kernelsu_init$' vmlinux.sym
          grep -q ' susfs_init$' vmlinux.sym
          grep -q ' susfs_add_sus_map$' vmlinux.sym
          grep -q ' nomount_init$' vmlinux.sym

          # #107 slim pass: net_tune, the RAM-tier tuner and MGLRU are all
          # gone from the source tree - none of their symbols may appear.
          if grep -qE ' (net_tune|ram_tune|lru_gen)_' vmlinux.sym; then
            echo 'net_tune/ram_tune/lru_gen must be removed (#107)' >&2
            exit 1
          fi

          # BPF LSM must be registered, not just configured on
          grep -q ' bpf_lsm_init$' vmlinux.sym

          make -s O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- kernelrelease | tee kernel.release
          sha256sum \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/dtb.img \
            out/arch/arm64/boot/dtbo.img | tee SHA256SUMS

          {
            echo "commit=${GITHUB_SHA}"
            echo "kernel.release=$(cat kernel.release)"
            echo "toolchain.source=ubuntu-24.04-llvm"
            clang --version | head -n 1 | sed 's/^/clang.version=/'
            ld.lld --version | head -n 1 | sed 's/^/lld.version=/'
            grep -E '(CONFIG_KSU|CONFIG_NOMOUNT|CONFIG_POSIX_MQUEUE|CONFIG_USER_NS|CONFIG_DEVTMPFS|CONFIG_SYSVIPC|CONFIG_DEFAULT_TCP_CONG|CONFIG_NET_SCH_DEFAULT|CONFIG_EROFS_FS|CONFIG_NTFS_FS|CONFIG_BPF_SYSCALL|CONFIG_MODULE_SIG_FORCE)' out/.config || true
          } | tee build-info.txt

      - name: Package AnyKernel3 flashable zip
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package-anykernel3.sh 2>&1 | tee package.log

      - name: Report packaging failure
        if: failure()
        shell: bash
        run: |
          tail -n 60 package.log 2>/dev/null \
            | sed 's/%/%25/g; s/\r/%0D/g; s/^/::error::pkg::/' || true

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-kernel-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 9
          retention-days: 90

  release:
    name: Publish release
    needs: build
    if: success()
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: miatoll-kernel-${{ github.run_number }}
          path: release-assets

      - name: Fetch manager APK and companion modules
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # gh release download (authenticated) avoids anonymous rate limits
          # and follows asset redirects; exact tags pinned for reproducibility.
          gh release download v3.3.0-55 -R backslashxx/KernelSU \
            -p 'KernelSU_v3.3.0-55_*-release.apk' -D release-assets
          mv release-assets/KernelSU_v3.3.0-55_*-release.apk \
             release-assets/KernelSU-manager.apk
          # second manager option: KernelSU-Next (kernel trusts its signature)
          gh release download v3.4.0 -R KernelSU-Next/KernelSU-Next \
            -p 'KernelSU_Next_v3.4.0_33294-release.apk' -D release-assets
          mv release-assets/KernelSU_Next_v3.4.0_33294-release.apk \
             release-assets/KernelSU-Next-manager.apk
          gh release download v0.0.68 -R rrr333nnn333/BRENE \
            -p 'BRENE-v0.0.68.zip' -D release-assets
          gh release download v2.0.0 -R maxsteeel/nomount \
            -p 'NoMount-v2.0.0-release.zip' -D release-assets
          mv release-assets/NoMount-v2.0.0-release.zip \
             release-assets/NoMount-v2.0.0.zip
          # sanity: all three must be zip/apk archives
          head -c2 release-assets/KernelSU-manager.apk | grep -q PK
          head -c2 release-assets/KernelSU-Next-manager.apk | grep -q PK
          head -c2 release-assets/BRENE-v0.0.68.zip | grep -q PK
          head -c2 release-assets/NoMount-v2.0.0.zip | grep -q PK
          ls -la release-assets/

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          # Release body = ONLY this build's changelog entry (bullets).
          awk -v n="${GITHUB_RUN_NUMBER}" '
            $0 ~ "^## #" n " " {f=1; print; next}
            f && /^## #/ {exit}
            f {print}
          ' CHANGELOG.md > release-notes.md
          grep -q . release-notes.md || head -8 CHANGELOG.md > release-notes.md

      - name: Create numbered release (history preserved)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # One release per build, numbered to match the zip (run number).
          # Old releases are never deleted — full history stays downloadable.
          TAG="stormbreaker-v${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Stormbreaker Kernel miatoll v${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.md \
            release-assets/Stormbreaker-miatoll-*.zip \
            release-assets/KernelSU-manager.apk \
            release-assets/KernelSU-Next-manager.apk \
            release-assets/BRENE-v0.0.68.zip \
            release-assets/NoMount-v2.0.0.zip
          gh release view "$TAG" --json url --jq '.url'
