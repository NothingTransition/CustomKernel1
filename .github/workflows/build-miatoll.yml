name: Stormbreaker — build & release (miatoll)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0bfbb-customkernel1
      - arena/01a1039d-customkernel1
      - arena/3bc926b5-customkernel1
    paths:
      - ".github/workflows/build-miatoll.yml"
      - "AnyKernel3/**"
      - "arch/**"
      - "block/**"
      - "certs/**"
      - "crypto/**"
      - "drivers/**"
      - "firmware/**"
      - "fs/**"
      - "include/**"
      - "init/**"
      - "ipc/**"
      - "kernel/**"
      - "lib/**"
      - "mm/**"
      - "net/**"
      - "scripts/**"
      - "security/**"
      - "sound/**"
      - "techpack/**"
      - "usr/**"
      - "virt/**"
      - "Makefile"
      - "Kbuild"
      - "Kconfig"

permissions:
  contents: read

concurrency:
  group: miatoll-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  DEFCONFIG: vendor/xiaomi/miatoll_defconfig

jobs:
  build:
    name: Compile and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison ccache clang flex git kmod libelf-dev libc6-dev lld llvm make \
            libssl-dev python3 rsync zip

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: miatoll-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            miatoll-ccache-${{ runner.os }}-

      - name: Verify LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Toolchain source: Ubuntu 24.04 LLVM"
            clang --version
            ld.lld --version
            llvm-ar --version
            llvm-nm --version
            llvm-objcopy --version
            for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
              command -v "$tool"
            done
          } | tee toolchain-info.txt

      - name: Generate and verify Miatoll configuration
        shell: bash
        run: |
          set -euo pipefail

          # Reject duplicate config symbols first. kconfig applies lines in
          # order and the LAST one wins, so a stale trailing "is not set"
          # silently defeats an earlier "=y" (this already happened twice:
          # ZSMALLOC_STAT, and EXT4_ENCRYPTION/NETFILTER_XT_TARGET_TRACE).
          #
          # $DEFCONFIG is a kconfig *target* name ("vendor/xiaomi/..."); make
          # resolves it under arch/$ARCH/configs/, so spell that out here -
          # reading the bare name as a path is what broke build #102.
          DEFCONFIG_PATH="arch/$ARCH/configs/$DEFCONFIG"
          test -f "$DEFCONFIG_PATH"

          awk '
            /^CONFIG_[A-Za-z0-9_]+=/ || /^# CONFIG_[A-Za-z0-9_]+ is not set/ {
              n = $0
              sub(/^# /, "", n); sub(/=.*/, "", n); sub(/ is not set/, "", n)
              cnt[n]++; line[n] = line[n] " " NR
            }
            END {
              bad = 0
              for (s in cnt)
                if (cnt[s] > 1) { print "DUPLICATE (" cnt[s] "x): " s " at lines" line[s]; bad++ }
              print "duplicate config symbols: " bad + 0
              exit (bad > 0)
            }
          ' "$DEFCONFIG_PATH"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- "$DEFCONFIG"

          require_config() {
            grep -qx "$1" out/.config || {
              echo "Required configuration missing: $1" >&2
              exit 1
            }
          }

          # KernelSU: backslashxx/KernelSU driver (scope-minimized manual
          # hooks + SUSFS support). Kprobes, syscall-table tampering and the
          # ARM64 branch-link hook stay off by design.
          require_config 'CONFIG_KSU=y'
          if grep -q '^CONFIG_KSU_KPROBES_KSUD=y' out/.config; then
            echo 'Kprobe hooks must remain disabled for manual integration' >&2
            exit 1
          fi
          require_config '# CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set'
          require_config '# CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set'
          require_config 'CONFIG_KSU_LSM_SECURITY_HOOKS=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_PATH=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_MOUNT=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_KSTAT=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_MAP=y'
          require_config 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y'
          require_config 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y'
          require_config 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y'
          require_config 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y'
          # SUSFS kernel side needs a built-in FUSE (get_fuse_inode()).
          require_config 'CONFIG_FUSE_FS=y'
          require_config 'CONFIG_NOMOUNT=y'
          # The eBPF backport is in this tree and BPF_SYSCALL/JIT stay on, but
          # BPF LSM is off in the v93 lineage this release is based on.
          require_config '# CONFIG_BPF_LSM is not set'
          # The eBPF stream parser (sockmap/sk_msg) is on. Build #103 broke on
          # net/core/skmsg.c backport leftovers and the option was disabled
          # again; the file compiles now (see net/core/skmsg.c +
          # include/linux/skmsg.h: saved_destroy is captured where the other
          # saved_* callbacks are), and it selects STREAM_PARSER and
          # NET_SOCK_MSG, which pull in skmsg.o, sock_map.o and tcp_bpf.o.
          require_config 'CONFIG_BPF_STREAM_PARSER=y'
          require_config 'CONFIG_STREAM_PARSER=y'
          require_config 'CONFIG_NET_SOCK_MSG=y'

          # BPF userspace compatibility spoof. Android's bpfloader /
          # netbpfload / netd / uprobestats pick their program set from the
          # uname() release string; the backport in this tree is exactly
          # v5.10, so they must be told 5.10 or they take the legacy path.
          require_config 'CONFIG_FAKE_UNAME_5_10=y'
          require_config '# CONFIG_FAKE_UNAME_NONE is not set'

          # The arm64 eBPF JIT is the one piece of the BPF subsystem this tree
          # did NOT get from its 5.10-era backport (kernel/bpf, the uapi and
          # the verifier are 5.10; arch/arm64/net/bpf_jit_comp.c is the 4.14
          # switch). It must know BPF_JMP32: the verifier emits JMP32 itself
          # when it rewrites 32-bit div/mod (kernel/bpf/verifier.c,
          # fixup_bpf_calls()) and clang emits it for 32-bit compares with
          # -mcpu=v3. Without the cases, that insn hits 'default:' in
          # build_insn() -> "unknown opcode" -> -EINVAL, and with
          # CONFIG_BPF_JIT_ALWAYS_ON=y there is no interpreter fallback, so the
          # program cannot be loaded at all. 22 cases = 20 compares + 2 JSET,
          # and the 32-bit forms must compare/tst/mov the 32-bit width
          # (is64 covers BPF_JMP, BPF_JMP32 stays narrow).
          test "$(grep -c 'case BPF_JMP32' arch/arm64/net/bpf_jit_comp.c)" -ge 22
          grep -q 'BPF_CLASS(code) == BPF_JMP;' arch/arm64/net/bpf_jit_comp.c
          grep -q 'emit(A64_CMP(is64, dst, src), ctx);' arch/arm64/net/bpf_jit_comp.c
          grep -q 'emit(A64_CMP(is64, dst, tmp), ctx);' arch/arm64/net/bpf_jit_comp.c
          grep -q 'emit(A64_TST(is64, dst, src), ctx);' arch/arm64/net/bpf_jit_comp.c
          grep -q 'emit(A64_TST(is64, dst, tmp), ctx);' arch/arm64/net/bpf_jit_comp.c
          # ... and the verifier's own JMP32 rewrite must stay, otherwise the
          # JIT gate above could be "satisfied" by deleting the feature.
          grep -q 'BPF_RAW_INSN((is64 ? BPF_JMP : BPF_JMP32) |' kernel/bpf/verifier.c

          # Hook call shape (backslashxx manual-hook ABI). The driver takes
          # the raw user pointer at faccessat/stat (const char __user **), and
          # the fstat/fstat64 return buffers are fixed up by the driver's
          # ksu_handle_newfstat_ret()/ksu_handle_fstat64_ret(). Assert the call
          # sites and the driver prototypes so an ABI drift fails the build.
          grep -q 'ksu_handle_faccessat(&dfd, &filename, &mode, NULL)' fs/open.c
          grep -q 'ksu_handle_stat(&dfd, &filename, &flags)' fs/stat.c
          grep -q 'ksu_handle_stat(&dfd, &filename, &flag)' fs/stat.c
          grep -q 'ksu_handle_newfstat_ret(&fd, &statbuf)' fs/stat.c
          grep -q 'ksu_handle_fstat64_ret(&fd, &statbuf)' fs/stat.c
          grep -q 'ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags)' fs/exec.c
          grep -q 'ksu_handle_sys_reboot(magic1, magic2, cmd, &arg)' kernel/reboot.c
          grep -q 'ksu_handle_faccessat(int \*dfd, const char __user \*\*filename_user, int \*mode' drivers/kernelsu/feature/sucompat.c
          # Fake uname must be COMPOSED with SUSFS, not fight it: the BPF
          # spoof is applied first and susfs_spoof_uname() runs after, so a
          # manager-configured SUSFS release always overwrites it. These
          # assertions pin that order and the narrow scope of the spoof.
          grep -q 'fake_bpf_uname(&tmp);' kernel/sys.c
          grep -q 'susfs_spoof_uname(&tmp);' kernel/sys.c
          test "$(grep -n 'fake_bpf_uname(&tmp);' kernel/sys.c | cut -d: -f1)" \
               -lt "$(grep -n 'susfs_spoof_uname(&tmp);' kernel/sys.c | cut -d: -f1)"
          grep -qF 'if (current_uid().val != 0)' kernel/sys.c
          grep -qF '"bpfloader", 9' kernel/sys.c
          grep -qF '"netbpfload", 10' kernel/sys.c
          grep -qF '"netd", 4' kernel/sys.c
          grep -qF '"uprobestats", 11' kernel/sys.c
          # SUSFS side unchanged: it only overwrites when the manager has set
          # a release, which is what makes "SUSFS wins" true.
          grep -qF 'if (my_uname.release[0] != ' fs/susfs.c
          grep -qF 'susfs_spoof_uname(&tmp);' kernel/sys.c
          # MANUAL-HOOK ABI (backslashxx driver): the kernel hands over the
          # raw user filename pointer and the driver rewrites it in place.
          # The 4.14 branch of the ksu_handle_stat prototype must be the one
          # in the tree, and its declaration must precede the call (clang 16+
          # turns an implicit declaration into a hard error - build #124).
          grep -qF 'ksu_handle_faccessat(&dfd, &filename, &mode, NULL)' fs/open.c
          grep -qF 'extern int ksu_handle_faccessat(int *, const char __user **, int *,' fs/open.c
          grep -qF 'extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags)' fs/stat.c
          stat_decl=$(grep -n 'extern int ksu_handle_stat(int \*dfd, const char __user \*\*filename_user, int \*flags)' fs/stat.c | head -1 | cut -d: -f1)
          stat_call=$(grep -n 'ksu_handle_stat(&dfd, &filename, &flags)' fs/stat.c | head -1 | cut -d: -f1)
          test -n "$stat_decl" && test -n "$stat_call" && test "$stat_decl" -lt "$stat_call"
          # The manual-hook-only fstat fixups: one site each, inside the
          # #ifndef CONFIG_KSU_SUSFS arms, so the SUSFS-mode path is compiled.
          test "$(grep -c 'ksu_handle_newfstat_ret(&fd, &statbuf)' fs/stat.c)" -eq 1
          test "$(grep -c 'ksu_handle_fstat64_ret(&fd, &statbuf)' fs/stat.c)" -eq 1
          # And the driver side of the same contract.
          grep -qF 'ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *__unused_flags)' drivers/kernelsu/feature/sucompat.c
          grep -qF 'ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags)' drivers/kernelsu/feature/sucompat.c
          grep -qF 'ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags)' drivers/kernelsu/feature/sucompat.c
          require_config 'CONFIG_BPF_JIT_ALWAYS_ON=y'
          require_config 'CONFIG_BPF_UNPRIV_DEFAULT_OFF=y'
          require_config 'CONFIG_PSI=y'
          require_config '# CONFIG_PSI_DEFAULT_DISABLED is not set'
          require_config 'CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"'
          require_config '# CONFIG_SECURITY_SELINUX_BOOTPARAM is not set'
          require_config 'CONFIG_SECURITY_SELINUX_DEVELOP=y'
          require_config 'CONFIG_SECCOMP_FILTER=y'
          require_config 'CONFIG_DM_VERITY=y'
          require_config 'CONFIG_DM_DEFAULT_KEY=y'
          require_config 'CONFIG_FS_VERITY=y'
          require_config 'CONFIG_INCREMENTAL_FS=y'
          require_config 'CONFIG_QUOTA=y'
          require_config 'CONFIG_SCHED_WALT=y'
          require_config 'CONFIG_MEMCG=y'
          # These were silently disabled by a duplicate trailing "is not set".
          require_config 'CONFIG_EXT4_ENCRYPTION=y'
          require_config 'CONFIG_FS_ENCRYPTION=y'
          require_config 'CONFIG_NETFILTER_XT_TARGET_TRACE=y'
          # Mobile-data default: BBRplus (BBR v1 + BBR v2 ACK
          # aggregation). Plain BBR v1 is built in as a switchable option.
          # fq_codel is compiled in while the default qdisc stays stock.
          require_config 'CONFIG_TCP_CONG_BBR=y'
          require_config 'CONFIG_TCP_CONG_BBRPLUS=y'
          require_config 'CONFIG_DEFAULT_TCP_CONG="bbrplus"'
          require_config '# CONFIG_NET_SCH_DEFAULT is not set'
          require_config 'CONFIG_NET_SCH_FQ_CODEL=y'
          # v93 lineage: MGLRU is compiled in (LRU_GEN=y).
          require_config 'CONFIG_LRU_GEN=y'
          # v93 lineage: the container/namespace set (Droidspaces fragment)
          # is on, as it was in the v93 build.
          require_config 'CONFIG_SYSVIPC=y'
          require_config 'CONFIG_POSIX_MQUEUE=y'
          require_config 'CONFIG_PID_NS=y'
          require_config 'CONFIG_USER_NS=y'
          require_config 'CONFIG_CGROUP_DEVICE=y'
          require_config 'CONFIG_CGROUP_PIDS=y'
          require_config 'CONFIG_CGROUP_NET_PRIO=y'
          require_config 'CONFIG_BRIDGE_NETFILTER=y'
          require_config 'CONFIG_NF_TABLES=y'
          require_config 'CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y'
          # v93 lineage: BFQ is the default I/O scheduler (as in the original
          # v93 build); CFQ, deadline and kyber stay selectable per disk.
          require_config 'CONFIG_DEFAULT_IOSCHED="bfq"'
          require_config '# CONFIG_KPROBES is not set'
          require_config 'CONFIG_EROFS_FS=y'
          require_config 'CONFIG_EROFS_FS_ZIP=y'
          require_config 'CONFIG_EROFS_FS_SECURITY=y'
          require_config 'CONFIG_NTFS_FS=y'
          require_config 'CONFIG_NTFS_RW=y'
          require_config 'CONFIG_BPF_SYSCALL=y'
          require_config 'CONFIG_BPF_JIT=y'
          require_config 'CONFIG_CGROUP_BPF=y'
          require_config '# CONFIG_MODULE_SIG_FORCE is not set'

      - name: Build kernel, DTB, DTBO and modules
        shell: bash
        run: |
          set -euo pipefail
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.cache/ccache"
          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=kernel-ci
          ccache --max-size=5G

          set +e
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC='ccache clang' CROSS_COMPILE=aarch64-linux-gnu- \
            >build.log 2>&1
          build_status=$?
          set -e

          if [ "$build_status" -ne 0 ]; then
            # Build failed. GitHub caps ::error:: annotations per step, and
            # logs/artifacts are not always retrievable, so the most useful
            # signal is ONE annotation carrying every distinct compiler error
            # (%0A is decoded as a newline by the runner).
            grep -E ' error:' build.log | sed 's/\r$//' | awk '!seen[$0]++' \
              | cut -c1-200 > build-errors.txt || true
            total=$(grep -c . build-errors.txt || true)
            head -n 25 build-errors.txt | sed 's/%/%25/g; s/$/%0A/' | tr -d '\n' \
              > build-errors-annot.txt || true
            printf '::error::Kernel build failed: %s distinct error lines. %s\n' \
              "${total:-0}" "$(cat build-errors-annot.txt 2>/dev/null)"
            echo "--- distinct compiler errors (${total:-0}) ---"
            cat build-errors.txt
            tail -n 300 build.log
            exit "$build_status"
          fi

          tail -n 100 build.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-build-failure-${{ github.run_number }}
          path: |
            build.log
            build-errors.txt
            toolchain-info.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish failure excerpt to job summary
        if: failure()
        shell: bash
        run: |
          {
            echo '## Build failure excerpt'
            echo
            echo '### Distinct errors'
            echo '```'
            cat build-errors.txt 2>/dev/null || echo '(build-errors.txt missing)'
            echo '```'
            echo '### First errors with context'
            echo '```'
            grep -n -B3 -A12 -m 30 'error:' build.log 2>/dev/null || tail -n 120 build.log 2>/dev/null || echo '(build.log missing)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Verify build products and KernelSU linkage
        shell: bash
        run: |
          set -euo pipefail

          # Every check announces itself, so a failure names the exact missing
          # product or symbol in an ::error:: annotation - GitHub caps annotations
          # per step and the raw logs are not always retrievable.
          check_file() {
            test -s "$1" || { echo "::error::verify: missing build product: $1"; exit 1; }
            echo "ok product: $1"
          }
          check_sym() {
            grep -q " $1\$" vmlinux.sym \
              || { echo "::error::verify: not linked into vmlinux: $1"; exit 1; }
            echo "ok symbol: $1"
          }

          check_file out/arch/arm64/boot/Image.gz
          check_file out/arch/arm64/boot/dtb.img
          check_file out/arch/arm64/boot/dtbo.img
          check_file out/arch/arm64/boot/dts/qcom/curtana-atoll-ab-idp-overlay.dtbo
          check_file out/drivers/kernelsu/ksu.o
          check_file out/fs/susfs.o
          check_file out/fs/nomount/nomount.o
          # eBPF stream parser (sockmap/sk_msg) - all three objects must exist.
          check_file out/net/core/skmsg.o
          check_file out/net/core/sock_map.o
          check_file out/net/ipv4/tcp_bpf.o
          check_file out/net/strparser/strparser.o

          # Write once instead of piping llvm-nm into grep -q: with pipefail,
          # grep's early exit makes llvm-nm report EPIPE (exit 74).
          llvm-nm out/vmlinux > vmlinux.sym
          check_sym ksu_handle_execveat
          check_sym ksu_handle_sys_reboot
          check_sym kernelsu_init
          # NOT kernelsu_init_early: the driver only compiles it (and only
          # *registers* it instead of kernelsu_init) when it is built as a
          # loadable module - its NEED_OWN_STACKPROTECTOR guard requires
          # defined(MODULE). This kernel builds CONFIG_KSU=y, so the init entry
          # point is kernelsu_init. Asserting the other one failed build #126.
          #
          # Kernel-side hook entry points and the SUSFS kernel side. If any of
          # these is missing, sucompat or the hiding stack is degraded without
          # the build saying so.
          check_sym susfs_init
          check_sym susfs_add_sus_map
          check_sym susfs_set_uname
          check_sym nomount_init
          # eBPF stream parser: if any of these is missing the option silently
          # collapsed and BPF_MAP_TYPE_SOCKMAP would not work.
          check_sym sk_psock_init
          check_sym sock_map_close
          check_sym sock_map_destroy
          check_sym sk_msg_alloc
          check_sym tcp_bpf_recvmsg
          check_sym strp_init

          # v93 lineage: MGLRU and the container/namespace set are back in.
          # The config assertions above are the real gate; this proves the
          # linked image agrees with them.
          check_sym lru_gen_init_lruvec
          check_sym lru_gen_init_mm
          check_sym sys_semget
          check_sym create_user_ns

          make -s O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- kernelrelease | tee kernel.release
          sha256sum \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/dtb.img \
            out/arch/arm64/boot/dtbo.img | tee SHA256SUMS

          {
            echo "commit=${GITHUB_SHA}"
            echo "kernel.release=$(cat kernel.release)"
            echo "toolchain.source=ubuntu-24.04-llvm"
            clang --version | head -n 1 | sed 's/^/clang.version=/'
            ld.lld --version | head -n 1 | sed 's/^/lld.version=/'
            grep -E '^(CONFIG_KSU|CONFIG_NOMOUNT|CONFIG_LRU_GEN|CONFIG_DEFAULT_IOSCHED|CONFIG_SYSVIPC|CONFIG_USER_NS|CONFIG_NF_TABLES|CONFIG_EROFS_FS|CONFIG_NTFS_FS|CONFIG_BPF|CONFIG_STREAM_PARSER|CONFIG_NET_SOCK_MSG|CONFIG_MODULE_SIG_FORCE)' out/.config || true
          } | tee build-info.txt

      - name: Package AnyKernel3 flashable zip
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package-anykernel3.sh 2>&1 | tee package.log

      - name: Report packaging failure
        if: failure()
        shell: bash
        run: |
          tail -n 60 package.log 2>/dev/null \
            | sed 's/%/%25/g; s/\r/%0D/g; s/^/::error::pkg::/' || true

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-kernel-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 9
          retention-days: 90

  release:
    name: Publish release
    needs: build
    if: success()
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: miatoll-kernel-${{ github.run_number }}
          path: release-assets

      - name: Fetch manager APK and companion modules
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # gh release download (authenticated) avoids anonymous rate limits
          # and follows asset redirects. The companion assets are immutable
          # copies published with stormbreaker-v111, so upstream tag churn
          # cannot break this build; upstream releases are the fallback.
          from_ours() { gh release download stormbreaker-v111 \
            -R "$GITHUB_REPOSITORY" -p "$1" -D release-assets --clobber; }

          # Manager APK: pinned to the backslashxx/KernelSU release the
          # vendored driver comes from. The version code in the asset name
          # (32663) is the KSU_VERSION the driver reports, so the manager and
          # the kernel agree on the ABI.
          #
          # Fallback: the immutable copy published with stormbreaker-v111 (the
          # same manager family). Upstream deletes its old tags, so our own
          # copy is what keeps a rebuild of an old pin possible.
          got_manager=0
          for tag in v3.3.0-62; do
            if gh release download "$tag" -R backslashxx/KernelSU \
                 -p 'KernelSU_v3.3.0-62_32663-release.apk' \
                 -D release-assets --clobber; then
              mv release-assets/KernelSU_v3.3.0-62_32663-release.apk \
                 release-assets/KernelSU-manager.apk
              echo "manager APK: from backslashxx/KernelSU $tag"
              got_manager=1
              break
            fi
          done
          if [ "$got_manager" -eq 0 ]; then
            if from_ours 'KernelSU-manager.apk'; then
              echo "manager APK: immutable copy from stormbreaker-v111"
            else
              echo "::error::KernelSU manager APK unavailable: the" \
                   "backslashxx/KernelSU $tag download failed and no release" \
                   "of ours carries KernelSU-manager.apk"
              exit 1
            fi
          fi

          if from_ours 'BRENE-v0.0.68.zip'; then
            echo "BRENE: from stormbreaker-v111"
          else
            gh release download v0.0.68 -R rrr333nnn333/BRENE \
              -p 'BRENE-v0.0.68.zip' -D release-assets --clobber
          fi

          if from_ours 'NoMount-v2.0.0.zip'; then
            echo "NoMount: from stormbreaker-v111"
          else
            gh release download v2.0.0 -R maxsteeel/nomount \
              -p 'NoMount-v2.0.0-release.zip' -D release-assets --clobber
            mv release-assets/NoMount-v2.0.0-release.zip \
               release-assets/NoMount-v2.0.0.zip
          fi
          # sanity: the manager APK and modules must be zip/apk archives
          head -c2 release-assets/KernelSU-manager.apk | grep -q PK
          head -c2 release-assets/BRENE-v0.0.68.zip | grep -q PK
          head -c2 release-assets/NoMount-v2.0.0.zip | grep -q PK
          # An HTML error page or a truncated download also starts with bytes
          # that can pass a header check, so look inside the APK: a real one
          # has AndroidManifest.xml and a dex payload.
          unzip -l release-assets/KernelSU-manager.apk | grep -q 'AndroidManifest.xml'
          unzip -l release-assets/KernelSU-manager.apk | grep -qE 'classes[0-9]*\.dex'
          ls -la release-assets/

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          # Release body = ONLY this build's changelog entry (bullets).
          awk -v n="${GITHUB_RUN_NUMBER}" '
            $0 ~ "^## #" n " " {f=1; print; next}
            f && /^## #/ {exit}
            f {print}
          ' CHANGELOG.md > release-notes.md
          if ! grep -q . release-notes.md; then
            # Run numbers and changelog entries can drift apart (a run killed
            # by an infrastructure outage still consumes its number, and the
            # retry lands on the next one). Ship the newest entry with a note
            # instead of dumping the file header.
            awk '/^## #/ {if (f) exit; f=1} f' CHANGELOG.md > entry.md
            {
              echo "> No changelog entry is numbered for build #${GITHUB_RUN_NUMBER};"
              echo "> this build ships the newest entry in CHANGELOG.md."
              echo
              cat entry.md
            } > release-notes.md
          fi
          grep -q . release-notes.md || head -8 CHANGELOG.md > release-notes.md
          head -n 3 release-notes.md

      - name: Create numbered release (history preserved)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # One release per build, numbered to match the zip (run number).
          # Superseded iteration builds are pruned by hand so the releases page
          # stays readable; the latest stable and the diagnostics pre-release are
          # always kept (README -> "Releases & tags").
          TAG="stormbreaker-v${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Stormbreaker Kernel miatoll v${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.md \
            release-assets/Stormbreaker-miatoll-*.zip \
            release-assets/KernelSU-manager.apk \
            release-assets/BRENE-v0.0.68.zip \
            release-assets/NoMount-v2.0.0.zip
          gh release view "$TAG" --json url --jq '.url'
