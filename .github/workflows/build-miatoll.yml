name: Build Miatoll Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0bfbb-customkernel1
    paths:
      - ".github/workflows/build-miatoll.yml"
      - "arch/**"
      - "block/**"
      - "certs/**"
      - "crypto/**"
      - "drivers/**"
      - "firmware/**"
      - "fs/**"
      - "include/**"
      - "init/**"
      - "ipc/**"
      - "kernel/**"
      - "lib/**"
      - "mm/**"
      - "net/**"
      - "scripts/**"
      - "security/**"
      - "sound/**"
      - "techpack/**"
      - "usr/**"
      - "virt/**"
      - "Makefile"
      - "Kbuild"
      - "Kconfig"

permissions:
  contents: read

concurrency:
  group: miatoll-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  DEFCONFIG: vendor/xiaomi/miatoll_defconfig
  AOSP_CLANG_REVISION: clang-r614150
  AOSP_CLANG_VERSION: 23.0.1
  AOSP_CLANG_COMMIT: 52b3c04ccd487048aaaabd0b99fd42618012fb65

jobs:
  build:
    name: Compile and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex git kmod libelf-dev \
            libssl-dev python3 rsync zip

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: miatoll-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            miatoll-ccache-${{ runner.os }}-

      - name: Fetch pinned AOSP Clang/LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail

          archive_url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${AOSP_CLANG_COMMIT}/${AOSP_CLANG_REVISION}.tar.gz"
          mkdir clang
          curl --fail --location --retry 3 "$archive_url" | tar -xz -C clang

          grep -Fxq "$AOSP_CLANG_VERSION" clang/AndroidVersion.txt
          test -x clang/bin/clang
          toolchain_bin="$PWD/clang/bin"
          echo "TOOLCHAIN_BIN=$toolchain_bin" >> "$GITHUB_ENV"
          echo "$toolchain_bin" >> "$GITHUB_PATH"

      - name: Verify LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "AOSP revision: $AOSP_CLANG_REVISION"
            echo "AOSP prebuilt commit: $AOSP_CLANG_COMMIT"
            clang --version
            ld.lld --version
            llvm-ar --version
            llvm-nm --version
            llvm-objcopy --version
          } | tee toolchain-info.txt

          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            if resolved="$(command -v "$tool")"; then
              echo "$tool=$resolved" | tee -a toolchain-info.txt
            else
              echo "$tool is not shipped by this LLVM distribution" | tee -a toolchain-info.txt
            fi
          done

          # Kbuild resolves every compiler/binutils command through the pinned
          # directory placed first in GITHUB_PATH. Assert the tools this build
          # actually requires without rejecting an otherwise complete archive
          # for an unused convenience frontend.
          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump; do
            test -x "$TOOLCHAIN_BIN/$tool"
          done

      - name: Generate and verify Miatoll configuration
        shell: bash
        run: |
          set -euo pipefail
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- "$DEFCONFIG"

          require_config() {
            grep -qx "$1" out/.config || {
              echo "Required configuration missing: $1" >&2
              exit 1
            }
          }

          require_config 'CONFIG_KSU=y'
          if grep -q '^CONFIG_KSU_KPROBES_KSUD=y' out/.config; then
            echo 'Kprobe hooks must remain disabled for manual integration' >&2
            exit 1
          fi
          require_config '# CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set'
          require_config '# CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set'
          require_config 'CONFIG_KSU_LSM_SECURITY_HOOKS=y'
          require_config '# CONFIG_KPROBES is not set'
          require_config 'CONFIG_EROFS_FS=y'
          require_config 'CONFIG_EROFS_FS_ZIP=y'
          require_config 'CONFIG_EROFS_FS_SECURITY=y'
          require_config 'CONFIG_NTFS_FS=y'
          require_config 'CONFIG_NTFS_RW=y'
          require_config 'CONFIG_BPF_SYSCALL=y'
          require_config 'CONFIG_BPF_JIT=y'
          require_config 'CONFIG_CGROUP_BPF=y'
          require_config '# CONFIG_MODULE_SIG_FORCE is not set'

      - name: Build kernel, DTB, DTBO and modules
        shell: bash
        run: |
          set -euo pipefail
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.cache/ccache"
          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=kernel-ci
          ccache --max-size=5G

          set +e
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC='ccache clang' CROSS_COMPILE=aarch64-linux-gnu- \
            >build.log 2>&1
          build_status=$?
          set -e

          if [ "$build_status" -ne 0 ]; then
            echo 'Kernel build failed. Relevant diagnostics:'
            grep -Ei 'error:|undefined reference|No rule to make target|Error [0-9]+' build.log \
              | tail -n 30 \
              | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/^/::error::/' || true
            tail -n 300 build.log
            exit "$build_status"
          fi

          tail -n 100 build.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-build-failure-${{ github.run_number }}
          path: |
            build.log
            toolchain-info.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify build products and KernelSU linkage
        shell: bash
        run: |
          set -euo pipefail

          test -s out/arch/arm64/boot/Image.gz
          test -s out/arch/arm64/boot/dtb.img
          test -s out/arch/arm64/boot/dtbo.img
          test -s out/arch/arm64/boot/dts/qcom/curtana-atoll-ab-idp-overlay.dtbo
          test -s out/drivers/kernelsu/ksu.o

          llvm-nm out/vmlinux | grep -q ' ksu_handle_execveat$'
          llvm-nm out/vmlinux | grep -q ' ksu_handle_sys_reboot$'
          llvm-nm out/vmlinux | grep -q ' kernelsu_init$'

          make -s O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- kernelrelease | tee kernel.release
          sha256sum \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/dtb.img \
            out/arch/arm64/boot/dtbo.img | tee SHA256SUMS

          {
            echo "commit=${GITHUB_SHA}"
            echo "kernel.release=$(cat kernel.release)"
            echo "toolchain.revision=$AOSP_CLANG_REVISION"
            echo "toolchain.commit=$AOSP_CLANG_COMMIT"
            clang --version | head -n 1 | sed 's/^/clang.version=/'
            ld.lld --version | head -n 1 | sed 's/^/lld.version=/'
            grep -E '^(CONFIG_KSU|CONFIG_EROFS_FS|CONFIG_NTFS_FS|CONFIG_BPF_SYSCALL|CONFIG_MODULE_SIG_FORCE)' out/.config || true
          } | tee build-info.txt

      - name: Package AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package artifacts
          mkdir -p package artifacts/modules
          rsync -a \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='placeholder' \
            AnyKernel3/ package/
          cp out/arch/arm64/boot/Image.gz package/

          (
            cd package
            zip -r9 ../artifacts/CustomKernel1-miatoll-KernelSU-${GITHUB_RUN_NUMBER}.zip .
          )

          find out -type f -name '*.ko' -exec cp --parents '{}' artifacts/modules/ \;
          cp kernel.release SHA256SUMS build-info.txt toolchain-info.txt artifacts/
          cp out/arch/arm64/boot/{Image.gz,dtb.img,dtbo.img} artifacts/
          sha256sum artifacts/CustomKernel1-*.zip >> artifacts/SHA256SUMS

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-kernel-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
