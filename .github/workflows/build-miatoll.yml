name: Stormbreaker — build & release (miatoll)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0bfbb-customkernel1
      - arena/01a1039d-customkernel1
      - arena/3bc926b5-customkernel1
    paths:
      - ".github/workflows/build-miatoll.yml"
      - "AnyKernel3/**"
      - "arch/**"
      - "block/**"
      - "certs/**"
      - "crypto/**"
      - "drivers/**"
      - "firmware/**"
      - "fs/**"
      - "include/**"
      - "init/**"
      - "ipc/**"
      - "kernel/**"
      - "lib/**"
      - "mm/**"
      - "net/**"
      - "scripts/**"
      - "security/**"
      - "sound/**"
      - "techpack/**"
      - "usr/**"
      - "virt/**"
      - "Makefile"
      - "Kbuild"
      - "Kconfig"

permissions:
  contents: read

concurrency:
  group: miatoll-kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  DEFCONFIG: vendor/xiaomi/miatoll_defconfig

jobs:
  build:
    name: Compile and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison ccache clang flex git kmod libelf-dev libc6-dev lld llvm make \
            libssl-dev python3 rsync zip

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: miatoll-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            miatoll-ccache-${{ runner.os }}-

      - name: Verify LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Toolchain source: Ubuntu 24.04 LLVM"
            clang --version
            ld.lld --version
            llvm-ar --version
            llvm-nm --version
            llvm-objcopy --version
            for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
              command -v "$tool"
            done
          } | tee toolchain-info.txt

      - name: Generate and verify Miatoll configuration
        shell: bash
        run: |
          set -euo pipefail

          # Reject duplicate config symbols first. kconfig applies lines in
          # order and the LAST one wins, so a stale trailing "is not set"
          # silently defeats an earlier "=y" (this already happened twice:
          # ZSMALLOC_STAT, and EXT4_ENCRYPTION/NETFILTER_XT_TARGET_TRACE).
          #
          # $DEFCONFIG is a kconfig *target* name ("vendor/xiaomi/..."); make
          # resolves it under arch/$ARCH/configs/, so spell that out here -
          # reading the bare name as a path is what broke build #102.
          DEFCONFIG_PATH="arch/$ARCH/configs/$DEFCONFIG"
          test -f "$DEFCONFIG_PATH"

          awk '
            /^CONFIG_[A-Za-z0-9_]+=/ || /^# CONFIG_[A-Za-z0-9_]+ is not set/ {
              n = $0
              sub(/^# /, "", n); sub(/=.*/, "", n); sub(/ is not set/, "", n)
              cnt[n]++; line[n] = line[n] " " NR
            }
            END {
              bad = 0
              for (s in cnt)
                if (cnt[s] > 1) { print "DUPLICATE (" cnt[s] "x): " s " at lines" line[s]; bad++ }
              print "duplicate config symbols: " bad + 0
              exit (bad > 0)
            }
          ' "$DEFCONFIG_PATH"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- "$DEFCONFIG"

          require_config() {
            grep -qx "$1" out/.config || {
              echo "Required configuration missing: $1" >&2
              exit 1
            }
          }

          # KernelSU: BakaSU driver v4.2.0-rc3, SUSFS inline-hook mode. The
          # hook sites this mode needs are checked by the driver's own
          # inline_hook_check.mk during the build; these assertions pin the
          # configuration it was integrated against.
          require_config 'CONFIG_KSU=y'
          require_config 'CONFIG_KSU_SUSFS=y'
          require_config '# CONFIG_KSU_TRACEPOINT_HOOK is not set'
          require_config '# CONFIG_KSU_MANUAL_HOOK is not set'
          # Manager policy: BakaSU/ReSukiSU + official KernelSU only. Turning
          # multi-manager support on would also accept the 5ec1cff, rsuntk,
          # SukiSU-Ultra and KOWX712 fork managers.
          require_config '# CONFIG_KSU_MULTI_MANAGER_SUPPORT is not set'
          require_config '# CONFIG_KSU_DISABLE_MANAGER is not set'
          require_config '# CONFIG_KSU_DISABLE_POLICY is not set'
          require_config 'CONFIG_KSU_SUSFS_SUS_PATH=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_MOUNT=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_KSTAT=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_MAP=y'
          require_config 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y'
          require_config 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y'
          require_config 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y'
          require_config 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y'
          # SUSFS kernel side needs a built-in FUSE (get_fuse_inode()).
          require_config 'CONFIG_FUSE_FS=y'
          require_config 'CONFIG_NOMOUNT=y'
          # The eBPF backport is in this tree and BPF_SYSCALL/JIT stay on, but
          # BPF LSM is off in the v93 lineage this release is based on.
          require_config '# CONFIG_BPF_LSM is not set'
          # The eBPF stream parser (sockmap/sk_msg) is on. Build #103 broke on
          # net/core/skmsg.c backport leftovers and the option was disabled
          # again; the file compiles now (see net/core/skmsg.c +
          # include/linux/skmsg.h: saved_destroy is captured where the other
          # saved_* callbacks are), and it selects STREAM_PARSER and
          # NET_SOCK_MSG, which pull in skmsg.o, sock_map.o and tcp_bpf.o.
          require_config 'CONFIG_BPF_STREAM_PARSER=y'
          require_config 'CONFIG_STREAM_PARSER=y'
          require_config 'CONFIG_NET_SOCK_MSG=y'

          # SUSFS inline-hook call shape. In this mode the driver takes a real
          # 'struct filename **' at faccessat/stat and rewrites ->name in
          # place, so the caller must build the filename with getname_flags()
          # and then look it up with filename_lookup(). The manual-hook form
          # (passing the raw 'const char __user *') also compiles, but makes
          # the driver dereference a user pointer as a struct filename - that
          # is a silent runtime bug, so it is rejected here.
          # (The legacy manual-hook call stays in fs/open.c, but only inside
          # its '#ifndef CONFIG_KSU_SUSFS' arm; the assertions below are what
          # prove the SUSFS-mode path is the one that is compiled.)
          grep -q 'ksu_handle_faccessat(&dfd, &fname, &mode, NULL)' fs/open.c
          grep -q 'ksu_handle_stat(&dfd, &fname, &flags)' fs/stat.c
          grep -q '#ifndef CONFIG_KSU_SUSFS' fs/open.c
          grep -q 'fname = getname_flags(filename, lookup_flags, NULL)' fs/open.c
          grep -q 'fname = getname_flags(filename, lookup_flags, NULL)' fs/stat.c
          require_config 'CONFIG_BPF_JIT_ALWAYS_ON=y'
          require_config 'CONFIG_BPF_UNPRIV_DEFAULT_OFF=y'
          require_config 'CONFIG_PSI=y'
          require_config '# CONFIG_PSI_DEFAULT_DISABLED is not set'
          require_config 'CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"'
          require_config '# CONFIG_SECURITY_SELINUX_BOOTPARAM is not set'
          require_config 'CONFIG_SECURITY_SELINUX_DEVELOP=y'
          require_config 'CONFIG_SECCOMP_FILTER=y'
          require_config 'CONFIG_DM_VERITY=y'
          require_config 'CONFIG_DM_DEFAULT_KEY=y'
          require_config 'CONFIG_FS_VERITY=y'
          require_config 'CONFIG_INCREMENTAL_FS=y'
          require_config 'CONFIG_QUOTA=y'
          require_config 'CONFIG_SCHED_WALT=y'
          require_config 'CONFIG_MEMCG=y'
          # These were silently disabled by a duplicate trailing "is not set".
          require_config 'CONFIG_EXT4_ENCRYPTION=y'
          require_config 'CONFIG_FS_ENCRYPTION=y'
          require_config 'CONFIG_NETFILTER_XT_TARGET_TRACE=y'
          # Mobile-data default: BBRplus (BBR v1 + BBR v2 ACK
          # aggregation). Plain BBR v1 is built in as a switchable option.
          # fq_codel is compiled in while the default qdisc stays stock.
          require_config 'CONFIG_TCP_CONG_BBR=y'
          require_config 'CONFIG_TCP_CONG_BBRPLUS=y'
          require_config 'CONFIG_DEFAULT_TCP_CONG="bbrplus"'
          require_config '# CONFIG_NET_SCH_DEFAULT is not set'
          require_config 'CONFIG_NET_SCH_FQ_CODEL=y'
          # v93 lineage: MGLRU is compiled in (LRU_GEN=y).
          require_config 'CONFIG_LRU_GEN=y'
          # v93 lineage: the container/namespace set (Droidspaces fragment)
          # is on, as it was in the v93 build.
          require_config 'CONFIG_SYSVIPC=y'
          require_config 'CONFIG_POSIX_MQUEUE=y'
          require_config 'CONFIG_PID_NS=y'
          require_config 'CONFIG_USER_NS=y'
          require_config 'CONFIG_CGROUP_DEVICE=y'
          require_config 'CONFIG_CGROUP_PIDS=y'
          require_config 'CONFIG_CGROUP_NET_PRIO=y'
          require_config 'CONFIG_BRIDGE_NETFILTER=y'
          require_config 'CONFIG_NF_TABLES=y'
          require_config 'CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y'
          # v93 lineage: BFQ is the default I/O scheduler (as in the original
          # v93 build); CFQ, deadline and kyber stay selectable per disk.
          require_config 'CONFIG_DEFAULT_IOSCHED="bfq"'
          require_config '# CONFIG_KPROBES is not set'
          require_config 'CONFIG_EROFS_FS=y'
          require_config 'CONFIG_EROFS_FS_ZIP=y'
          require_config 'CONFIG_EROFS_FS_SECURITY=y'
          require_config 'CONFIG_NTFS_FS=y'
          require_config 'CONFIG_NTFS_RW=y'
          require_config 'CONFIG_BPF_SYSCALL=y'
          require_config 'CONFIG_BPF_JIT=y'
          require_config 'CONFIG_CGROUP_BPF=y'
          require_config '# CONFIG_MODULE_SIG_FORCE is not set'

      - name: Build kernel, DTB, DTBO and modules
        shell: bash
        run: |
          set -euo pipefail
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.cache/ccache"
          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=kernel-ci
          ccache --max-size=5G

          set +e
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC='ccache clang' CROSS_COMPILE=aarch64-linux-gnu- \
            >build.log 2>&1
          build_status=$?
          set -e

          if [ "$build_status" -ne 0 ]; then
            echo 'Kernel build failed. Relevant diagnostics:'
            awk 'BEGIN{f=0; n=0} /error:/ { f=1 } f { print; n++ } n>=45 { exit }' build.log \
              | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g; s/^/::error::/' || true
            tail -n 300 build.log
            exit "$build_status"
          fi

          tail -n 100 build.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-build-failure-${{ github.run_number }}
          path: |
            build.log
            toolchain-info.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish failure excerpt to job summary
        if: failure()
        shell: bash
        run: |
          {
            echo '## Build failure excerpt'
            echo '```'
            grep -n -B3 -A12 -m 30 'error:' build.log 2>/dev/null || tail -n 120 build.log 2>/dev/null || echo '(build.log missing)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Verify build products and KernelSU linkage
        shell: bash
        run: |
          set -euo pipefail

          test -s out/arch/arm64/boot/Image.gz
          test -s out/arch/arm64/boot/dtb.img
          test -s out/arch/arm64/boot/dtbo.img
          test -s out/arch/arm64/boot/dts/qcom/curtana-atoll-ab-idp-overlay.dtbo
          test -s out/drivers/kernelsu/kernelsu.o
          test -s out/fs/susfs.o
          test -s out/fs/nomount/nomount.o
          # eBPF stream parser (sockmap/sk_msg) - all three objects must exist.
          test -s out/net/core/skmsg.o
          test -s out/net/core/sock_map.o
          test -s out/net/ipv4/tcp_bpf.o
          test -s out/net/strparser/strparser.o

          # Write once instead of piping llvm-nm into grep -q: with pipefail,
          # grep's early exit makes llvm-nm report EPIPE (exit 74).
          llvm-nm out/vmlinux > vmlinux.sym
          grep -q ' ksu_handle_execveat$' vmlinux.sym
          grep -q ' ksu_handle_sys_reboot$' vmlinux.sym
          grep -q ' kernelsu_init$' vmlinux.sym
          grep -q ' kernelsu_init_early$' vmlinux.sym
          # The three hook sites added for the SUSFS inline-hook mode: if any
          # of these is not linked, sucompat/su-hiding is silently degraded.
          grep -q ' ksu_handle_setresuid$' vmlinux.sym
          grep -q ' ksu_handle_sys_read$' vmlinux.sym
          grep -q ' ksu_handle_input_handle_event$' vmlinux.sym
          grep -q ' susfs_init$' vmlinux.sym
          grep -q ' susfs_add_sus_map$' vmlinux.sym
          grep -q ' nomount_init$' vmlinux.sym
          # eBPF stream parser: if any of these is missing the option silently
          # collapsed and BPF_MAP_TYPE_SOCKMAP would not work.
          grep -q ' sk_psock_init$' vmlinux.sym
          grep -q ' sock_map_close$' vmlinux.sym
          grep -q ' sock_map_destroy$' vmlinux.sym
          grep -q ' sk_msg_alloc$' vmlinux.sym
          grep -q ' tcp_bpf_recvmsg$' vmlinux.sym
          grep -q ' strp_init$' vmlinux.sym

          # v93 lineage: MGLRU and the container/namespace set are back in.
          # The config assertions above are the real gate; this proves the
          # linked image agrees with them.
          grep -q ' lru_gen_init_lruvec$' vmlinux.sym
          grep -q ' lru_gen_init_mm$' vmlinux.sym
          grep -q ' sys_semget$' vmlinux.sym
          grep -q ' create_user_ns$' vmlinux.sym

          make -s O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- kernelrelease | tee kernel.release
          sha256sum \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/dtb.img \
            out/arch/arm64/boot/dtbo.img | tee SHA256SUMS

          {
            echo "commit=${GITHUB_SHA}"
            echo "kernel.release=$(cat kernel.release)"
            echo "toolchain.source=ubuntu-24.04-llvm"
            clang --version | head -n 1 | sed 's/^/clang.version=/'
            ld.lld --version | head -n 1 | sed 's/^/lld.version=/'
            grep -E '^(CONFIG_KSU|CONFIG_NOMOUNT|CONFIG_LRU_GEN|CONFIG_DEFAULT_IOSCHED|CONFIG_SYSVIPC|CONFIG_USER_NS|CONFIG_NF_TABLES|CONFIG_EROFS_FS|CONFIG_NTFS_FS|CONFIG_BPF|CONFIG_STREAM_PARSER|CONFIG_NET_SOCK_MSG|CONFIG_MODULE_SIG_FORCE)' out/.config || true
          } | tee build-info.txt

      - name: Package AnyKernel3 flashable zip
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package-anykernel3.sh 2>&1 | tee package.log

      - name: Report packaging failure
        if: failure()
        shell: bash
        run: |
          tail -n 60 package.log 2>/dev/null \
            | sed 's/%/%25/g; s/\r/%0D/g; s/^/::error::pkg::/' || true

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-kernel-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 9
          retention-days: 90

  release:
    name: Publish release
    needs: build
    if: success()
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: miatoll-kernel-${{ github.run_number }}
          path: release-assets

      - name: Fetch manager APK and companion modules
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # gh release download (authenticated) avoids anonymous rate limits
          # and follows asset redirects. The companion assets are immutable
          # copies published with stormbreaker-v111, so upstream tag churn
          # cannot break this build; upstream releases are the fallback.
          from_ours() { gh release download stormbreaker-v111 \
            -R "$GITHUB_REPOSITORY" -p "$1" -D release-assets --clobber; }

          # Manager APK: pinned to the BakaSU release the vendored driver
          # comes from. The version code in the asset name (35171) is the
          # same KSU_VERSION the driver reports, so manager and kernel agree
          # on the ABI.
          #
          # Fallback: scan our own releases (newest first) for an immutable
          # copy of that exact APK. Older releases carry the retired
          # backslashxx manager under a different name (KernelSU-manager.apk,
          # version code 32655) which talks to a different driver ABI, so a
          # name match on "BakaSU-manager.apk" is required - never fall back
          # to the stale manager.
          pinned_manager_from_own_releases() {
            local tag
            for tag in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=40" \
                           --jq '.[].tag_name'); do
              if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
                   --jq '.assets[].name' | grep -qx 'BakaSU-manager.apk'; then
                gh release download "$tag" -R "$GITHUB_REPOSITORY" \
                  -p 'BakaSU-manager.apk' -D release-assets --clobber \
                  && { echo "manager APK: pinned copy from $tag"; return 0; }
              fi
            done
            return 1
          }

          got_manager=0
          for tag in v4.2.0-rc3; do
            if gh release download "$tag" -R Baka-SU/BakaSU \
                 -p 'ReSukiSU_v4.2.0-rc3_35171-universal-release.apk' \
                 -D release-assets --clobber; then
              mv release-assets/ReSukiSU_v4.2.0-rc3_35171-universal-release.apk \
                 release-assets/BakaSU-manager.apk
              echo "manager APK: from Baka-SU/BakaSU $tag"
              got_manager=1
              break
            fi
          done
          if [ "$got_manager" -eq 0 ]; then
            pinned_manager_from_own_releases || {
              echo "::error::BakaSU manager APK unavailable: the Baka-SU/BakaSU $tag" \
                   "download failed and no release of ours carries BakaSU-manager.apk yet"
              exit 1
            }
          fi

          if from_ours 'BRENE-v0.0.68.zip'; then
            echo "BRENE: from stormbreaker-v111"
          else
            gh release download v0.0.68 -R rrr333nnn333/BRENE \
              -p 'BRENE-v0.0.68.zip' -D release-assets --clobber
          fi

          if from_ours 'NoMount-v2.0.0.zip'; then
            echo "NoMount: from stormbreaker-v111"
          else
            gh release download v2.0.0 -R maxsteeel/nomount \
              -p 'NoMount-v2.0.0-release.zip' -D release-assets --clobber
            mv release-assets/NoMount-v2.0.0-release.zip \
               release-assets/NoMount-v2.0.0.zip
          fi
          # sanity: the manager APK and modules must be zip/apk archives
          head -c2 release-assets/BakaSU-manager.apk | grep -q PK
          head -c2 release-assets/BRENE-v0.0.68.zip | grep -q PK
          head -c2 release-assets/NoMount-v2.0.0.zip | grep -q PK
          # An HTML error page or a truncated download also starts with bytes
          # that can pass a header check, so look inside the APK: a real one
          # has AndroidManifest.xml and a dex payload.
          unzip -l release-assets/BakaSU-manager.apk | grep -q 'AndroidManifest.xml'
          unzip -l release-assets/BakaSU-manager.apk | grep -qE 'classes[0-9]*\.dex'
          ls -la release-assets/

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          # Release body = ONLY this build's changelog entry (bullets).
          awk -v n="${GITHUB_RUN_NUMBER}" '
            $0 ~ "^## #" n " " {f=1; print; next}
            f && /^## #/ {exit}
            f {print}
          ' CHANGELOG.md > release-notes.md
          if ! grep -q . release-notes.md; then
            # Run numbers and changelog entries can drift apart (a run killed
            # by an infrastructure outage still consumes its number, and the
            # retry lands on the next one). Ship the newest entry with a note
            # instead of dumping the file header.
            awk '/^## #/ {if (f) exit; f=1} f' CHANGELOG.md > entry.md
            {
              echo "> No changelog entry is numbered for build #${GITHUB_RUN_NUMBER};"
              echo "> this build ships the newest entry in CHANGELOG.md."
              echo
              cat entry.md
            } > release-notes.md
          fi
          grep -q . release-notes.md || head -8 CHANGELOG.md > release-notes.md
          head -n 3 release-notes.md

      - name: Create numbered release (history preserved)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # One release per build, numbered to match the zip (run number).
          # Superseded iteration builds are pruned by hand so the releases page
          # stays readable; the latest stable and the diagnostics pre-release are
          # always kept (README -> "Releases & tags").
          TAG="stormbreaker-v${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Stormbreaker Kernel miatoll v${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.md \
            release-assets/Stormbreaker-miatoll-*.zip \
            release-assets/BakaSU-manager.apk \
            release-assets/BRENE-v0.0.68.zip \
            release-assets/NoMount-v2.0.0.zip
          gh release view "$TAG" --json url --jq '.url'
