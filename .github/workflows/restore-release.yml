name: Stormbreaker — restore a pruned release from CI artifacts

# One-shot recovery tool. GitHub keeps every build's artifact for 90 days, so a
# release that was pruned by hand can be recreated from the exact artifact its
# CI run uploaded - no rebuild, byte-identical zip. CI has the network access
# for artifact download and asset upload that the dev sandbox does not.
#
# Used on 2026-10-04 to bring back stormbreaker-v93 (pruned during the #110
# releases cleanup): run #93 = 37125698258, artifact miatoll-kernel-93,
# commit d62bca985.
#
# Trigger: push touching this file or restore/**, or manual dispatch.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0bfbb-customkernel1
      - arena/01a1039d-customkernel1
    paths:
      - ".github/workflows/restore-release.yml"
      - "restore/**"

permissions:
  contents: write
  actions: read

jobs:
  restore:
    name: Restore stormbreaker-v93 from its artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Download the original #93 artifact
        uses: actions/download-artifact@v4
        with:
          name: miatoll-kernel-93
          run-id: 37125698258
          github-token: ${{ github.token }}
          path: a93

      - name: Locate the flashable zip
        shell: bash
        run: |
          set -euo pipefail
          find a93 -type f | sort
          Z=$(find a93 -type f -name 'Stormbreaker-miatoll-*.zip' | head -1)
          test -n "$Z"
          cp "$Z" ./Stormbreaker-miatoll-KSU-SUSFS-NoMount-93.zip
          ls -la Stormbreaker-miatoll-KSU-SUSFS-NoMount-93.zip

      - name: Prepare the release notes
        shell: bash
        run: |
          set -euo pipefail
          sha=$(sha256sum Stormbreaker-miatoll-KSU-SUSFS-NoMount-93.zip | cut -d' ' -f1)
          {
            echo "## Stormbreaker v93 — original build, restored"
            echo
            echo "The exact zip from CI run #93 (\`37125698258\`, commit \`d62bca985\`, 2026-10-03) — recovered from that run's artifact, not rebuilt."
            echo
            echo "- Zip SHA-256: \`$sha\`"
            echo "- Original build subject: \"manager APK: backslashxx v3.3.0-52 -> v3.3.0-54 (versionCode 32655)\""
            echo "- Restored on request — the #110 releases cleanup had pruned it."
            echo "- Manager APKs and the companion modules (BRENE, NoMount) live on the current releases; they are userspace and independent of this kernel build."
            echo "- Historical build: for daily use take the newest \`stormbreaker-v*\` (or \`stormbreaker-v108\` on Infinity X 4.0)."
          } > notes.md
          echo "notes ready:"
          cat notes.md

      - name: Create the release and upload the zip (REST API)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          # Any failure is re-emitted as an ::error:: annotation so it is
          # readable from the API (job logs are not reachable from the dev
          # sandbox).
          fail() { printf '%s\n' "$1" | tail -25 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

          TAG=stormbreaker-v93
          echo "== clearing any existing release/tag =="
          gh release view "$TAG" >/dev/null 2>&1 && \
            { gh release delete "$TAG" --yes --cleanup-tag || fail "delete failed"; } || echo "no existing release"

          echo "== creating the release =="
          if ! out=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                -f tag_name="$TAG" \
                -f target_commitish=d62bca985c13de0a6041b9d81d817cadfb3fed55 \
                -f name="Stormbreaker v93 — restored original build" \
                -F draft=false -F prerelease=false -F make_latest=false \
                -f body="$(cat notes.md)" 2>&1); then
            fail "gh api releases create: $out"
          fi
          rid=$(printf '%s' "$out" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])') \
            || fail "could not read release id from: $out"
          echo "release id: $rid"

          echo "== uploading the zip =="
          if ! up=$(gh api -X POST \
                -H "Content-Type: application/zip" \
                --input Stormbreaker-miatoll-KSU-SUSFS-NoMount-93.zip \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$rid/assets?name=Stormbreaker-miatoll-KSU-SUSFS-NoMount-93.zip" 2>&1); then
            fail "asset upload failed: $up"
          fi
          printf '%s' "$up" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("uploaded:",d["name"],d["size"],"bytes")' \
            || echo "uploaded (raw): $up"

          echo "== verify =="
          gh release view "$TAG" --json url,assets \
            --jq '.url, (.assets[] | "  \(.name) \(.size) bytes")'
