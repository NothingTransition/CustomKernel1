name: Stormbreaker — restore a pruned release from CI artifacts

# One-shot recovery tool. GitHub keeps every build's artifact for 90 days, so a
# release that was pruned by hand can be recreated from the exact artifact its
# CI run uploaded - no rebuild, byte-identical zip. CI has the network access
# for artifact download and asset upload that the dev sandbox does not.
#
# Used on 2026-10-04 to bring back stormbreaker-v93 (pruned during the #110
# releases cleanup): run #93 = 37125698258, artifact miatoll-kernel-93,
# commit d62bca985.
#
# Attach-first design: the release object itself is created out of band (the
# dev sandbox can reach POST /releases, this runner's token gets 403 there for
# reasons only GitHub knows), so this workflow only has to *upload the asset*
# to the release that already exists. Upload uses the asset endpoint
# (uploads.github.com), a different code path - worth testing on its own.
# If the release is missing the workflow falls back to creating it, and if
# that 403s it parks the zip on a throwaway branch so the zip can still be
# recovered without rebuilding.
#
# Trigger: push touching this file or restore/**, or manual dispatch.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0bfbb-customkernel1
      - arena/01a1039d-customkernel1
    paths:
      - ".github/workflows/restore-release.yml"
      - "restore/**"

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch the original #93 artifact
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download the artifact from run 37125698258
        uses: actions/download-artifact@v4
        with:
          name: miatoll-kernel-93
          run-id: 37125698258
          github-token: ${{ github.token }}
          path: a93

      - name: Hand it to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: v93-zip
          path: a93
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Attach the zip to stormbreaker-v93
    needs: fetch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the zip from this run
        uses: actions/download-artifact@v4
        with:
          name: v93-zip
          path: a93

      - name: Locate the flashable zip
        shell: bash
        run: |
          set -euo pipefail
          find a93 -type f | sort
          Z=$(find a93 -type f -name 'Stormbreaker-miatoll-*.zip' | head -1)
          test -n "$Z"
          cp "$Z" ./Stormbreaker-miatoll-KSU-SUSFS-NoMount-93.zip
          ls -la Stormbreaker-miatoll-KSU-SUSFS-NoMount-93.zip

      - name: Prepare the release notes
        shell: bash
        run: |
          set -euo pipefail
          sha=$(sha256sum Stormbreaker-miatoll-KSU-SUSFS-NoMount-93.zip | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_ENV"
          {
            echo "## Stormbreaker v93 — original build, restored"
            echo
            echo "The exact zip from CI run #93 (\`37125698258\`, commit \`d62bca985\`, 2026-10-03) — recovered from that run's artifact, not rebuilt."
            echo
            echo "- Zip SHA-256: \`$sha\`"
            echo "- Original build subject: \"manager APK: backslashxx v3.3.0-52 -> v3.3.0-54 (versionCode 32655)\""
            echo "- Restored on request — the #110 releases cleanup had pruned it."
            echo "- Manager APKs and the companion modules (BRENE, NoMount) live on the current releases; they are userspace and independent of this kernel build."
            echo "- Historical build: for daily use take the newest \`stormbreaker-v*\` (or \`stormbreaker-v108\` on Infinity X 4.0)."
          } > notes.md
          cat notes.md

      - name: Attach the asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          # Failures and probes are emitted as annotations so they are readable
          # through the API (the dev sandbox cannot fetch job logs).
          ann() { printf '%s\n' "$1" | tail -25 | while IFS= read -r l; do echo "::error::$l"; done; }
          probe() { printf '%s\n' "$1" | while IFS= read -r l; do echo "::warning::PROBE $l"; done; }

          TAG=stormbreaker-v93
          REPO="$GITHUB_REPOSITORY"
          ZIP=Stormbreaker-miatoll-KSU-SUSFS-NoMount-93.zip

          probe "repo permissions: $(gh api "repos/$REPO" -q -c '.permissions' 2>&1)"
          probe "token scopes header: $(curl -sS -o /dev/null -D - -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/ 2>&1 | tr -d '\r' | grep -i '^x-oauth-scopes\|^x-accepted-oauth-scopes' | paste -sd' ' -)"

          # 1) Preferred: the release already exists (created out of band) -> upload.
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            if out=$(gh release upload "$TAG" "$ZIP" -R "$REPO" --clobber 2>&1); then
              probe "asset upload to the existing release: OK"
            else
              probe "asset upload failed: $out"
            fi
          fi

          # 2) No release yet -> create it on the existing tag (no --target, the
          #    tag already points at d62bca985) and let gh upload the asset.
          if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            if out=$(gh release create "$TAG" -R "$REPO" \
                  --title "Stormbreaker v93 — restored original build" \
                  --notes-file notes.md \
                  "$ZIP" 2>&1); then
              probe "gh release create with asset: OK"
            else
              ann "gh release create failed: $out"
              # 3) Last resort: park the zip on a throwaway branch (git push is
              #    a contents:write operation, so this also tells us whether the
              #    token has write at all).
              git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" br >/dev/null 2>&1 || true
              if [ -d br ]; then
                cd br
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git checkout -b "restore-v93-${GITHUB_RUN_NUMBER}"
                cp ../"$ZIP" .
                git add -f "$ZIP"
                git commit -q -m "restore: v93 zip from run 37125698258 ($sha256)"
                if out2=$(git push origin HEAD 2>&1); then
                  probe "fallback branch restore-v93-${GITHUB_RUN_NUMBER}: push OK"
                else
                  ann "fallback branch push failed too: $out2"
                fi
              else
                ann "fallback clone failed"
              fi
              exit 1
            fi
          fi

          # Refresh the notes with the sha and keep the Latest badge on v110.
          gh release edit "$TAG" -R "$REPO" --notes-file notes.md \
            || probe "notes edit failed (release still fine)"
          gh release edit "$TAG" -R "$REPO" --latest=false \
            || probe "could not demote Latest - check the badge manually"

          gh release view "$TAG" -R "$REPO" --json url,assets \
            --jq '.url, (.assets[] | "  \(.name) \(.size) bytes")'
