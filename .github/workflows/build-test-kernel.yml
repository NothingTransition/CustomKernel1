name: Build Flashable Kernel (miatoll) - KSU-Next 3.3.0 - LLVM

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0c26a-customkernel1]
    paths:
      - 'arch/**'
      - 'drivers/**'
      - 'KernelSU-Next/**'
      - '.github/workflows/build-test-kernel.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: miatoll-llvm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Install deps + latest LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential ccache libncurses-dev git zip unzip rsync python3 clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          clang --version | head -n1
          ld.lld --version | head -n1
          llvm-ar --version | head -n1
          aarch64-linux-gnu-gcc --version | head -n1

      - name: Defconfig
        run: |
          rm -rf out && mkdir -p out
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 vendor/xiaomi/miatoll_defconfig
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_EROFS" out/.config | head -n 20

      - name: Build with LLVM (latest clang)
        run: |
          export LC_ALL=C
          export USE_CCACHE=1
          time make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- 2>&1 | tee build.log
          echo "=== BUILD DONE ==="
          ls -lh out/arch/arm64/boot/Image* out/arch/arm64/boot/dtb* out/arch/arm64/boot/dtbo* 2>&1 | head -n 40
          ls -lh out/vmlinux 2>&1 | head -n 5
          du -h out/arch/arm64/boot/ | tail -n 10

      - name: Verify Image is REAL (>5M)
        if: always()
        run: |
          set +e
          echo "=== Verify ==="
          ls -lh out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image 2>&1 | head -n 20
          ls -lh out/arch/arm64/boot/ 2>&1 | head -n 30
          find out/arch/arm64/boot -type f 2>&1 | xargs ls -lh 2>&1 | head -n 30 || true
          SZ=$(stat -c%s out/arch/arm64/boot/Image.gz 2>/dev/null || stat -c%s out/arch/arm64/boot/Image 2>/dev/null || echo 0)
          echo "Image size bytes=$SZ"
          if [ "$SZ" -lt 5000000 ]; then
            echo "WARN Image <5M (expected ~12M), but continuing to package for debug"
            ls -lhR out/arch/arm64/boot/ 2>&1 | head -n 100 || true
            tail -n 300 build.log 2>&1 | head -n 100 || true
          else
            echo "OK Image >5M"
          fi
          echo "vmlinux:"
          ls -lh out/vmlinux 2>&1 | head -n 5 || true
          du -h out/ 2>&1 | tail -n 20 || true

      - name: Package FLASHABLE (AnyKernel3)
        if: always()
        run: |
          set +e
          set +o pipefail
          set -x
          TANGGAL=$(date +"%Y%m%d-%H%M")
          echo "TANGGAL=$TANGGAL" >> $GITHUB_ENV
          rm -rf package artifacts && mkdir -p package artifacts
          rsync -a --exclude='.git' AnyKernel3/ package/
          ls -lh package/ | head -n 20
          cp -v out/arch/arm64/boot/Image.gz package/ 2>&1 | head -n 5 || { echo "Image.gz missing, trying Image"; gzip -c out/arch/arm64/boot/Image > package/Image.gz 2>&1 | head -n 5 || echo "both cp and gzip failed"; }
          ls -lh package/Image.gz 2>&1 | head -n 5 || echo "package/Image.gz not found, ls failed"
          ls -lh package/ 2>&1 | head -n 30 || true
          SZ=$(stat -c%s package/Image.gz 2>/dev/null || echo 0); echo "package Image.gz $SZ"; if [ "$SZ" -lt 5000000 ]; then echo "WARN package Image <5M, continuing"; fi
          (cd package && zip -r9 ../artifacts/Stormbreaker-miatoll-KSU-Next-v3.3.0-${TANGGAL}-FLASHABLE.zip . 2>&1 | head -n 50)
          ls -lh artifacts/ | head -n 30
          SZ2=$(stat -c%s artifacts/Stormbreaker*.zip 2>/dev/null || echo 0); echo "zip $SZ2"; if [ "$SZ2" -lt 7000000 ]; then echo "WARN zip <7M, but continuing"; fi
          cp -v out/arch/arm64/boot/Image.gz artifacts/ || true
          cp build.log artifacts/ || true
          ls -lh artifacts/

      - name: Upload FLASHABLE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stormbreaker-miatoll-FLASHABLE-${{ env.TANGGAL || 'unknown' }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "### ✅ Flashable LLVM Build Ready" >> $GITHUB_STEP_SUMMARY
          echo "- Toolchain: ubuntu-24.04 LLVM (latest clang) + aarch64-linux-gnu-gcc" >> $GITHUB_STEP_SUMMARY
          echo "- Flash: artifacts/Stormbreaker-*.zip via TWRP/OrangeFox" >> $GITHUB_STEP_SUMMARY
          ls -lh artifacts/ 2>&1 | head -n 30 >> $GITHUB_STEP_SUMMARY || true
          ls -lh out/arch/arm64/boot/Image* 2>&1 | head -n 20 >> $GITHUB_STEP_SUMMARY || true
