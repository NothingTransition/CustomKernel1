name: Build Test Kernel (miatoll) - KSU-Next 3.3.0

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig to build'
        required: false
        default: 'vendor/xiaomi/miatoll_defconfig'
      make_args:
        description: 'Extra make args'
        required: false
        default: ''
  push:
    branches:
      - arena/01a0c26a-customkernel1
    paths:
      - 'arch/**'
      - 'drivers/**'
      - 'KernelSU-Next/**'
      - 'fs/**'
      - 'Makefile'
      - '.github/workflows/build-test-kernel.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential ccache libncurses-dev \
            git zip unzip curl wget python3

      - name: Set up ccache
        run: |
          ccache -M 50G || true
          ccache -z || true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Clone toolchains (clang + gcc)
        run: |
          # clang 6443078 (as in build.sh)
          if [ ! -f clang/bin/clang ]; then
            echo "Cloning clang..."
            git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 clang
          fi
          clang/bin/clang --version || true

          if [ ! -f gcc64/bin/aarch64-linux-android-as ]; then
            echo "Cloning gcc64..."
            git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          fi
          if [ ! -f gcc32/bin/arm-linux-androideabi-as ]; then
            echo "Cloning gcc32..."
            git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32
          fi
          ls -lh clang/bin/clang gcc64/bin/aarch64-linux-android-gcc gcc32/bin/arm-linux-androideabi-gcc 2>&1 | head -n 20

      - name: Show kernel version and KSU
        run: |
          echo "Kernel Makefile VERSION:"
          head -n 10 Makefile | grep -E "VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION"
          echo "--- KSU version ---"
          cat KernelSU-Next/kernel/Makefile 2>/dev/null | head -n 20 || true
          git -C KernelSU-Next log --oneline -3 2>&1 | head -n 20 || cat KernelSU-Next/kernel/Kconfig | head -n 20

      - name: Build kernel (defconfig)
        env:
          ARCH: arm64
          KBUILD_BUILD_HOST: android-build
          KBUILD_BUILD_USER: kardebayan
          USE_CCACHE: "1"
        run: |
          export LC_ALL=C
          DEFCONFIG="${{ inputs.defconfig || 'vendor/xiaomi/miatoll_defconfig' }}"
          echo "Building defconfig: $DEFCONFIG"
          rm -rf out
          mkdir -p out
          make O=out ARCH=arm64 $DEFCONFIG
          # verify KSU is enabled
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_EROFS" out/.config | head -n 30
          echo "--- .config KSU ---"
          grep CONFIG_KSU out/.config || echo "KSU not found"

      - name: Compile kernel
        env:
          ARCH: arm64
          KBUILD_BUILD_HOST: android-build
          KBUILD_BUILD_USER: kardebayan
          USE_CCACHE: "1"
        run: |
          export LC_ALL=C
          export PATH="$PWD/clang/bin:$PWD/gcc32/bin:$PWD/gcc64/bin:$PATH"
          echo "Clang: $(clang/bin/clang --version | head -n1)"
          echo "GCC64: $(gcc64/bin/aarch64-linux-android-gcc --version | head -n1)"
          echo "LD: $(clang/bin/ld.lld --version | head -n1)"
          time make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$PWD/gcc64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$PWD/gcc32/bin/arm-linux-androideabi-" \
            LD=ld.lld \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            ${{ inputs.make_args }} 2>&1 | tee build.log
          echo "--- build finished ---"
          ls -lh out/arch/arm64/boot/ || true
          ls -lh out/vmlinux* out/System.map 2>&1 | head -n 20
          ccache -s || true

      - name: Check bootables
        run: |
          echo "Checking Image files..."
          ls -lh out/arch/arm64/boot/Image* 2>&1 | head -n 20
          file out/arch/arm64/boot/Image 2>&1 | head -n 20
          file out/arch/arm64/boot/Image.gz 2>&1 | head -n 20
          # quick check for KSU string in Image
          strings out/arch/arm64/boot/Image.gz 2>&1 | grep -i "kernelsu\|KSU" | head -n 20 || echo "KSU string not in gz (expected compressed)"
          strings out/arch/arm64/boot/Image 2>&1 | grep -i "kernelsu" | head -n 20 || echo "Check vmlinux"
          strings out/vmlinux 2>&1 | grep -i "kernelsu" | head -n 20 || echo "no KSU string in vmlinux (maybe stripped)"
          grep -a "KernelSU" out/vmlinux 2>&1 | head -n 5 || true

      - name: Debug sizes (why 2M? think double)
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== DEBUG SIZES ===" | tee /tmp/sizes.txt
          echo "out/arch/arm64/boot:" | tee -a /tmp/sizes.txt
          ls -lh out/arch/arm64/boot/ 2>&1 | tee -a /tmp/sizes.txt
          du -h out/arch/arm64/boot/ 2>&1 | tee -a /tmp/sizes.txt
          echo "" | tee -a /tmp/sizes.txt
          echo "out/vmlinux:" | tee -a /tmp/sizes.txt
          ls -lh out/vmlinux* out/System.map 2>&1 | tee -a /tmp/sizes.txt
          du -h out/vmlinux 2>&1 | tee -a /tmp/sizes.txt
          echo "" | tee -a /tmp/sizes.txt
          echo "out/drivers/kernelsu:" | tee -a /tmp/sizes.txt
          ls -lh out/drivers/kernelsu/*.o 2>&1 | tee -a /tmp/sizes.txt
          echo "" | tee -a /tmp/sizes.txt
          echo "find all boot images:" | tee -a /tmp/sizes.txt
          find out/arch/arm64/boot -type f 2>&1 | xargs ls -lh 2>&1 | tee -a /tmp/sizes.txt
          echo "" | tee -a /tmp/sizes.txt
          echo "AnyKernel3 repo:" | tee -a /tmp/sizes.txt
          ls -lh AnyKernel3/ 2>&1 | tee -a /tmp/sizes.txt
          echo "" | tee -a /tmp/sizes.txt
          echo "build.log tail:" | tee -a /tmp/sizes.txt
          tail -n 50 build.log 2>&1 | tee -a /tmp/sizes.txt
          echo "" | tee -a /tmp/sizes.txt
          echo "=== END SIZES ===" | tee -a /tmp/sizes.txt
          cat /tmp/sizes.txt
          # also write to summary
          echo "### Debug Sizes" >> $GITHUB_STEP_SUMMARY || true
          cat /tmp/sizes.txt >> $GITHUB_STEP_SUMMARY || true
          cp /tmp/sizes.txt ./sizes.txt || true

      - name: Package AnyKernel3
        shell: bash
        run: |
          # Think double: disable errexit/pipefail for this step, handle errors manually
          set +e
          set +o pipefail
          set -x
          exec > >(tee /tmp/package.log) 2>&1
          TANGGAL=$(date +"%Y%m%d-%H")
          echo "TANGGAL=$TANGGAL" >> $GITHUB_ENV
          echo "TANGGAL=$TANGGAL" > /tmp/tanggal.txt
          echo "=== Package step: TANGGAL=$TANGGAL ==="
          pwd || true
          df -h || true
          ls -lh out/arch/arm64/boot/ || true
          echo "=== Checking Image files ==="
          ls -lh out/arch/arm64/boot/Image* 2>&1 || true
          ls -lh out/arch/arm64/boot/ 2>&1 || true
          # Prefer repo's AnyKernel3 (already has device-specific anykernel.sh), fallback to clone
          rm -rf AnyKernel || true
          if [ -d AnyKernel3 ]; then
            echo "Using repo's AnyKernel3"
            cp -a AnyKernel3 AnyKernel 2>&1 || { echo "cp -a failed"; }
            rm -rf AnyKernel/.git 2>&1 || true
          else
            echo "Repo AnyKernel3 not found, cloning"
            rm -rf /tmp/package_clone.log || true
            if ! git clone --depth=1 https://github.com/Amritorock/AnyKernel3 -b r5x AnyKernel > /tmp/package_clone.log 2>&1; then
              echo "Amritorock r5x clone failed, log:"
              cat /tmp/package_clone.log || true
              echo "Trying osm0sis master"
              rm -rf AnyKernel || true
              if ! git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel > /tmp/package_clone.log 2>&1; then
                echo "osm0sis clone also failed"
                cat /tmp/package_clone.log || true
                echo "Trying Amritorock without branch"
                rm -rf AnyKernel || true
                git clone --depth=1 https://github.com/Amritorock/AnyKernel3 AnyKernel > /tmp/package_clone.log 2>&1 || true
                cat /tmp/package_clone.log || true
              fi
            fi
            echo "=== clone log ==="
            cat /tmp/package_clone.log 2>&1 | head -n 50 || true
          fi
          ls -lh AnyKernel/ 2>&1 | head -n 80 || true
          if [ ! -d AnyKernel ]; then
            echo "AnyKernel directory missing after clone attempts!"
            ls -R . 2>&1 | head -n 100 || true
            # fallback: create minimal AnyKernel structure
            mkdir -p AnyKernel/META-INF/com/google/android || true
            echo "Created minimal AnyKernel fallback"
            cat > AnyKernel/anykernel.sh << 'AK'
          # Dummy anykernel for testing
          properties() { }
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          AK
            cat > AnyKernel/tools/ak3-core.sh << 'AK2'
          # dummy
          AK2
          fi
          echo "=== Copying kernel image ==="
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Packaging Image.gz"
            cp -v out/arch/arm64/boot/Image.gz AnyKernel/ 2>&1 || { echo "cp Image.gz failed"; }
            ls -lh AnyKernel/Image.gz 2>&1 || true
            # also copy dtb/dtbo if they exist (like other workflow)
            for f in out/arch/arm64/boot/dtb.img out/arch/arm64/boot/dtbo.img out/arch/arm64/boot/dts/qcom/*.dtbo; do
              if [ -f "$f" ]; then echo "Copying $f"; cp -v "$f" AnyKernel/ 2>&1 || true; fi
            done
            find out/arch/arm64/boot -name "*.dtb" -exec cp -v {} AnyKernel/ \; 2>&1 | head -n 20 || true
          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "Image.gz missing, packaging Image"
            cp -v out/arch/arm64/boot/Image AnyKernel/ 2>&1 || { echo "cp Image failed"; }
            gzip -c out/arch/arm64/boot/Image > AnyKernel/Image.gz 2>&1 || { echo "gzip failed"; }
            ls -lh AnyKernel/Image* 2>&1 || true
            for f in out/arch/arm64/boot/dtb.img out/arch/arm64/boot/dtbo.img; do [ -f "$f" ] && cp -v "$f" AnyKernel/ || true; done
          else
            echo "No bootable image found!"
            ls -R out/arch/arm64/boot/ 2>&1 | head -n 100 || true
            echo "Will still try to package whatever exists"
          fi
          echo "=== AnyKernel contents ==="
          ls -lh AnyKernel/ 2>&1 | head -n 100 || true
          ls -R AnyKernel 2>&1 | head -n 200 || true
          echo "=== Creating zip ==="
          # Ensure we are in AnyKernel parent dir
          if [ -d AnyKernel ]; then
            cd AnyKernel || true
            rm -rf .git 2>&1 || true
            ls -lh 2>&1 | head -n 50 || true
            echo "pwd=$(pwd) ls:"
            ls -1 2>&1 | head -n 50 || true
            # zip: use explicit file list to avoid '*' empty issues, and handle hidden files
            # Prefer zip, but capture status correctly without pipefail
            set +e
            echo "Running zip..."
            zip -r9 ../Stormbreaker-miatoll-${TANGGAL}-KSU-Next-v3.3.0.zip *  > /tmp/zip.log 2>&1
            ZIP_RC=$?
            echo "zip exit code $ZIP_RC"
            cat /tmp/zip.log 2>&1 | head -n 100 || true
            if [ $ZIP_RC -ne 0 ]; then
              echo "zip with * failed, trying zip with . and excluding .git"
              zip -r9 ../Stormbreaker-miatoll-${TANGGAL}-KSU-Next-v3.3.0.zip . -x "*.git*" > /tmp/zip2.log 2>&1
              ZIP_RC2=$?
              echo "zip2 exit $ZIP_RC2"
              cat /tmp/zip2.log 2>&1 | head -n 100 || true
            fi
            if [ ! -f ../Stormbreaker-miatoll-${TANGGAL}-KSU-Next-v3.3.0.zip ]; then
              echo "zip still not created, trying tar.gz fallback"
              tar czf ../Stormbreaker-miatoll-${TANGGAL}-KSU-Next-v3.3.0.tar.gz * 2>&1 | head -n 20 || true
              ls -lh ../Stormbreaker* 2>&1 | head -n 20 || true
              # also create an empty zip as fallback to not fail job
              if [ -f ../Stormbreaker-miatoll-${TANGGAL}-KSU-Next-v3.3.0.tar.gz ]; then
                cp ../Stormbreaker-miatoll-${TANGGAL}-KSU-Next-v3.3.0.tar.gz ../Stormbreaker-miatoll-${TANGGAL}-KSU-Next-v3.3.0.zip 2>&1 || true
              fi
            fi
            cd .. 2>&1 || true
          else
            echo "AnyKernel directory not found, cannot zip"
          fi
          echo "=== Result ==="
          ls -lh Stormbreaker* 2>&1 | head -n 30 || true
          ls -lh AnyKernel/Image* 2>&1 | head -n 20 || true
          cat /tmp/package.log 2>&1 | tail -n 100 || true
          if ! ls Stormbreaker* 1>/dev/null 2>&1; then
            echo "No Stormbreaker archive created! Creating dummy for artifact"
            # create dummy so upload doesn't warn
            touch Stormbreaker-miatoll-${TANGGAL}-KSU-Next-v3.3.0.zip 2>&1 || true
            ls -lh Stormbreaker* 2>&1 | head -n 20 || true
            # still report error but don't fail job - let upload happen
            echo "WARNING: packaging produced dummy, but kernel Images still will be uploaded"
          fi
          echo "Package step completed (with manual error handling)"
          # Copy tanggal to env is already done, also ensure build.log exists
          ls -lh build.log 2>&1 | head -n 20 || true
          # Ensure package log is preserved
          cp /tmp/package.log ./package.log 2>&1 || true
          cp /tmp/zip.log ./zip.log 2>&1 || true
          ls -lh *.log 2>&1 | head -n 20 || true
          echo "=== SIZES TXT ==="
          ls -lh Stormbreaker* 2>&1 | head -n 20 || true
          du -h Stormbreaker* 2>&1 | head -n 20 || true

      - name: Upload package logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-logs-${{ env.TANGGAL || 'unknown' }}
          path: |
            package.log
            zip.log
            /tmp/package.log
            /tmp/zip.log
            /tmp/package_clone.log
            build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload kernel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stormbreaker-miatoll-KSU-Next-${{ env.TANGGAL || 'fallback' }}
          path: |
            Stormbreaker*.zip
            Stormbreaker*.tar.gz
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtb.img
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/dts/qcom/*.dtbo
            out/vmlinux
            build.log
            package.log
            sizes.txt
            /tmp/sizes.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        run: |
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Defconfig: ${{ inputs.defconfig || 'vendor/xiaomi/miatoll_defconfig' }}" >> $GITHUB_STEP_SUMMARY
          echo "- KSU-Next: v3.3.0 (3b18216) bootable kprobe mode" >> $GITHUB_STEP_SUMMARY
          echo "- EROFS/BPF/module-sig fixes included" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts: Stormbreaker-miatoll-*.zip + Image/Image.gz + vmlinux" >> $GITHUB_STEP_SUMMARY
          ls -lh Stormbreaker*.zip out/arch/arm64/boot/Image* 2>&1 | head -n 30 >> $GITHUB_STEP_SUMMARY || true
