name: Build Stormbreaker Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0cfe5-customkernel1
      - a
      - main
    paths:
      - ".github/workflows/build.yml"
      - "AnyKernel3/**"
      - "arch/**"
      - "block/**"
      - "certs/**"
      - "crypto/**"
      - "drivers/**"
      - "firmware/**"
      - "fs/**"
      - "include/**"
      - "init/**"
      - "ipc/**"
      - "kernel/**"
      - "lib/**"
      - "mm/**"
      - "net/**"
      - "scripts/**"
      - "security/**"
      - "sound/**"
      - "techpack/**"
      - "usr/**"
      - "virt/**"
      - "Makefile"
      - "Kbuild"
      - "Kconfig"

permissions:
  contents: read


env:
  ARCH: arm64
  DEFCONFIG: vendor/xiaomi/miatoll_defconfig

jobs:
  build:
    name: Compile and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison ccache clang flex git kmod libelf-dev libc6-dev lld llvm make \
            libssl-dev python3 rsync zip

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: stormbreaker-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            stormbreaker-ccache-${{ runner.os }}-

      - name: Verify LLVM toolchain (Clang 18 pure, like crdroid sm8150 build.config.common)
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Toolchain source: Ubuntu 24.04 LLVM - Clang 18 pure, no GCC (CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1)"
            echo "Reference: https://github.com/crdroidandroid/android_kernel_xiaomi_sm8150 build.config.common"
            echo "BRANCH=android-4.14 CC=clang LD=ld.lld ARCH=arm64 LLVM=1 LLVM_IAS=1"
            clang --version
            ld.lld --version
            llvm-ar --version
            llvm-nm --version
            llvm-objcopy --version
            for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
              command -v "$tool"
            done
          } | tee toolchain-info.txt

      - name: Generate and verify Miatoll configuration (crdroid sm8150 reference)
        shell: bash
        run: |
          set -euo pipefail
          # Pure Clang 18 build like crdroid sm8150: CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- "$DEFCONFIG"

          require_config() {
            grep -qx "$1" out/.config || {
              echo "Required configuration missing: $1" >&2
              exit 1
            }
          }

          # Module signing must not be forced (allow unsigned modules)
          require_config '# CONFIG_MODULE_SIG_FORCE is not set'
          # BBR + FQ for BBR
          require_config 'CONFIG_TCP_CONG_BBR=y'
          require_config 'CONFIG_NET_SCH_FQ=y'
          require_config 'CONFIG_NET_SCH_FQ_CODEL=y'
          require_config 'CONFIG_DEFAULT_BBR=y'
          # NTFS RW
          require_config 'CONFIG_NTFS_FS=y'
          require_config 'CONFIG_NTFS_RW=y'
          # F2FS entirely (like crdroid enables)
          require_config 'CONFIG_F2FS_FS=y'
          require_config 'CONFIG_F2FS_FS_SECURITY=y'
          require_config 'CONFIG_F2FS_FS_ENCRYPTION=y'
          require_config 'CONFIG_F2FS_FS_COMPRESSION=y'
          # EROFS fully
          require_config 'CONFIG_EROFS_FS=y'
          # BPF
          require_config 'CONFIG_BPF_SYSCALL=y'
          require_config 'CONFIG_BPF_JIT=y'
          require_config 'CONFIG_CGROUP_BPF=y'
          # KernelSU Next v3.4.0 + SUSFS v2.3.0 (reference: crdroid sm8150 drivers/kernelsu, fs/susfs.c)
          require_config 'CONFIG_KSU=y'
          require_config 'CONFIG_KSU_SUSFS=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_PATH=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_MOUNT=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_KSTAT=y'
          require_config 'CONFIG_KSU_SUSFS_TRY_UMOUNT=y'
          require_config 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y'
          require_config 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y'
          require_config 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y'
          require_config 'CONFIG_KSU_SUSFS_SUS_MAP=y'
          # No modules - we removed USB_GSPCA, RMNET_PERF, RMNET_SHS
          if grep -q "^CONFIG_USB_GSPCA=m" out/.config; then echo "USB_GSPCA should be disabled" >&2; exit 1; fi
          if grep -q "^CONFIG_RMNET_PERF=m" out/.config; then echo "RMNET_PERF should be disabled" >&2; exit 1; fi
          if grep -q "^CONFIG_RMNET_SHS=m" out/.config; then echo "RMNET_SHS should be disabled" >&2; exit 1; fi
          if grep -q "^CONFIG_USB_GSPCA=y" out/.config; then echo "USB_GSPCA should be disabled" >&2; exit 1; fi
          if grep -q "^CONFIG_RMNET_PERF=y" out/.config; then echo "RMNET_PERF should be disabled" >&2; exit 1; fi
          if grep -q "^CONFIG_RMNET_SHS=y" out/.config; then echo "RMNET_SHS should be disabled" >&2; exit 1; fi

          echo "Config verification passed (crdroid sm8150 reference: KSU Next + SUSFS + F2FS/EROFS/BBR/BPF)"
          grep -E "KSU|SUSFS|BBR|NTFS|F2FS|EROFS|MODULE_SIG|BPF|SCHED_FQ" out/.config | sort

      - name: Build kernel, DTB, DTBO (pure Clang 18, LLVM=1 LLVM_IAS=1)
        shell: bash
        run: |
          set -euo pipefail
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.cache/ccache"
          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=kernel-ci
          ccache --max-size=5G
          ccache -z

          set +e
          # crdroid sm8150 reference build.config.common: CC=clang LD=ld.lld
          # We use LLVM=1 LLVM_IAS=1 which sets CC=clang LD=ld.lld automatically, plus ccache
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC='ccache clang' LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            >build.log 2>&1
          build_status=$?
          set -e

          if [ "$build_status" -ne 0 ]; then
            echo 'Kernel build failed. Relevant diagnostics:'
            grep -Ei 'error:|undefined reference|No rule to make target|Error [0-9]+' build.log \
              | tail -n 150 || true
            tail -n 400 build.log
            echo '### Build Failure Diagnostics' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -Ei 'error:|undefined reference|No rule to make target|Error [0-9]+' build.log | tail -n 100 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo '#### Last 200 lines' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 200 build.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit "$build_status"
          fi

          tail -n 100 build.log
          ccache -s

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-build-failure-${{ github.run_number }}
          path: |
            build.log
            out/.config
            toolchain-info.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build.log to gist for debugging (bypass Azure blob TLS issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "Uploading build.log to gist..."
          # Create gist with build.log tail
          tail -n 1000 build.log > build-tail.log
          gh gist create build-tail.log --public -d "miatoll build failure ${{ github.run_number }} tail" 2>&1 | tee gist-url.txt || true
          cat gist-url.txt || true
          # Also try to upload full log split
          grep -Ei 'error:|undefined reference|No rule to make target|Error [0-9]+' build.log | tail -n 200 > build-errors.log
          gh gist create build-errors.log --public -d "miatoll build errors ${{ github.run_number }}" 2>&1 | tee gist-errors-url.txt || true
          cat gist-errors-url.txt || true
          set -e

      - name: Verify build products
        shell: bash
        run: |
          set -euo pipefail
          ls -lh out/arch/arm64/boot/
          test -s out/arch/arm64/boot/Image.gz
          if [ -f out/arch/arm64/boot/dtb.img ]; then
            test -s out/arch/arm64/boot/dtb.img
            echo "dtb.img exists"
          fi
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            test -s out/arch/arm64/boot/dtbo.img
            echo "dtbo.img exists"
          fi
          if [ -f out/arch/arm64/boot/dts/qcom/curtana-atoll-ab-idp-overlay.dtbo ]; then
            test -s out/arch/arm64/boot/dts/qcom/curtana-atoll-ab-idp-overlay.dtbo
          fi

          make -s O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- kernelrelease | tee kernel.release
          sha256sum out/arch/arm64/boot/Image.gz | tee SHA256SUMS
          if [ -f out/arch/arm64/boot/dtb.img ]; then sha256sum out/arch/arm64/boot/dtb.img >> SHA256SUMS; fi
          if [ -f out/arch/arm64/boot/dtbo.img ]; then sha256sum out/arch/arm64/boot/dtbo.img >> SHA256SUMS; fi

          {
            echo "commit=${GITHUB_SHA}"
            echo "kernel.release=$(cat kernel.release)"
            echo "toolchain.source=ubuntu-24.04-llvm Clang 18 pure (CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1)"
            echo "reference=crdroidandroid/android_kernel_xiaomi_sm8150"
            echo "ksu.version=v3.4.0"
            echo "susfs.version=v2.3.0"
            clang --version | head -n 1 | sed 's/^/clang.version=/'
            ld.lld --version | head -n 1 | sed 's/^/lld.version=/'
            grep -E '^(CONFIG_KSU|CONFIG_TCP_CONG_BBR|CONFIG_NTFS_FS|CONFIG_F2FS_FS|CONFIG_EROFS_FS|CONFIG_BPF_SYSCALL|CONFIG_MODULE_SIG_FORCE)' out/.config || true
          } | tee build-info.txt

      - name: Package AnyKernel3 flashable zip (osm0sis layout)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package artifacts
          mkdir -p artifacts
          rsync -a \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='placeholder' \
            AnyKernel3/ package/

          # Copy kernel images
          cp out/arch/arm64/boot/Image.gz package/Image.gz
          if [ -f out/arch/arm64/boot/dtb.img ]; then
            cp out/arch/arm64/boot/dtb.img package/dtb
            cp out/arch/arm64/boot/dtb.img package/dtb.img || true
          fi
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img package/dtbo.img
          fi

          # No modules - all built-in (removed USB_GSPCA, RMNET_PERF, RMNET_SHS)
          # osm0sis AnyKernel3 layout: ramdisk/, modules/, patch/ with flash.sh type structure
          mkdir -p package/ramdisk package/patch package/modules

          (
            cd package
            zip -r9 "../artifacts/Stormbreaker-miatoll-Clang18-KSU-SUSFS-${GITHUB_RUN_NUMBER}.zip" .
          )

          cp kernel.release SHA256SUMS build-info.txt toolchain-info.txt artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz artifacts/ 2>/dev/null || true
          [ -f out/arch/arm64/boot/dtb.img ] && cp out/arch/arm64/boot/dtb.img artifacts/ || true
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img artifacts/ || true
          sha256sum artifacts/Stormbreaker-miatoll-*.zip >> artifacts/SHA256SUMS 2>/dev/null || true
          unzip -l artifacts/Stormbreaker-miatoll-*.zip | head -n 40
          ls -lh artifacts/

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-kernel-${{ github.run_number }}-Clang18-KSU-SUSFS
          path: artifacts/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
