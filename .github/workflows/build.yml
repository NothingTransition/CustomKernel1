name: Build Stormbreaker Kernel - Clang 18 Fast

concurrency:
  group: stormbreaker-miatoll-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - a
      - arena/**
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Clang 18 + deps (fast apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget lsb-release software-properties-common gnupg
          # Add LLVM apt repo for clang 18
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-18 lld-18 llvm-18 \
            bc bison flex libssl-dev libelf-dev \
            ccache git zip python3 \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu
          clang-18 --version
          ld.lld-18 --version
          # Symlink clang-18 as clang for kernel build
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100
          sudo update-alternatives --install /usr/bin/llvm-ar llvm-ar /usr/bin/llvm-ar-18 100
          sudo update-alternatives --install /usr/bin/llvm-nm llvm-nm /usr/bin/llvm-nm-18 100
          sudo update-alternatives --install /usr/bin/llvm-objcopy llvm-objcopy /usr/bin/llvm-objcopy-18 100
          sudo update-alternatives --install /usr/bin/llvm-objdump llvm-objdump /usr/bin/llvm-objdump-18 100
          sudo update-alternatives --install /usr/bin/llvm-strip llvm-strip /usr/bin/llvm-strip-18 100
          sudo update-alternatives --install /usr/bin/llvm-readelf llvm-readelf /usr/bin/llvm-readelf-18 100
          clang --version
          ld.lld --version

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: stormbreaker-clang18-${{ hashFiles('**/miatoll_defconfig') }}
          max-size: 2G

      - name: Build Kernel - Pure Clang 18 (apt, no GCC prebuilt)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_HOST=android-build
          export KBUILD_BUILD_USER=kardebayan
          export USE_CCACHE=1
          export CCACHE_SLOPPINESS="pch_defines,time_macros"
          ccache -M 2G
          ccache -z

          make O=out ARCH=arm64 vendor/xiaomi/miatoll_defconfig
          echo "=== Defconfig OK ==="
          grep -E "MODULE_SIG|BBR|F2FS|KPROBES" out/.config | head -n 20

          echo "=== Fast Clang 18 Build (apt) ==="
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            HOSTCXX="ccache clang++" \
            LD="ld.lld" \
            AR="llvm-ar" \
            NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" \
            OBJDUMP="llvm-objdump" \
            STRIP="llvm-strip" \
            READELF="llvm-readelf" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
            LLVM=1 \
            LLVM_IAS=1 \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            2>&1 | tee out/build.log

          ccache -s
          ls -lh out/arch/arm64/boot/
          [ -f out/arch/arm64/boot/Image.gz ] && echo "Image.gz OK" || ( [ -f out/arch/arm64/boot/Image ] && gzip -k out/arch/arm64/boot/Image && echo "Image gzipped" )
          tail -n 50 out/build.log

      - name: Package AnyKernel3
        run: |
          TANGGAL=$(date +"%Y%m%d-%H")
          echo "TANGGAL=$TANGGAL" >> $GITHUB_ENV
          ZIMAGE=out/arch/arm64/boot/Image.gz
          [ -f "$ZIMAGE" ] || ZIMAGE=out/arch/arm64/boot/Image
          [ -f "$ZIMAGE" ] || (echo "No image!" && exit 1)
          du -h $ZIMAGE

          rm -rf AnyKernel
          cp -r AnyKernel3 AnyKernel
          cp $ZIMAGE AnyKernel/
          rm -f AnyKernel/STRUCTURE.md

          cd AnyKernel
          zip -r9 Stormbreaker-miatoll-${TANGGAL}-Clang18-Fast.zip * -x .git README.md *placeholder .placeholder
          ls -lh *.zip
          cd ..

      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: Stormbreaker-miatoll-${{ env.TANGGAL }}-Clang18
          path: AnyKernel/*.zip
          retention-days: 14

      - name: Upload Log on Fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/build.log
          retention-days: 3
