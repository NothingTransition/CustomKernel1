name: Build Stormbreaker Kernel - Clang 18

on:
  push:
    branches:
      - a
      - arena/**
      - main
      - master
  pull_request:
    branches:
      - a
      - main
  workflow_dispatch:
    inputs:
      make_clean:
        description: 'Make clean build'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex \
            libssl-dev libelf-dev \
            libncurses-dev \
            libudev-dev \
            ccache \
            git zip unzip \
            python3 python3-pip \
            lld llvm \
            binutils-aarch64-linux-gnu \
            build-essential
          echo "Dependencies installed"
          ccache --version
          ld.lld --version || true

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-kernel-${{ hashFiles('**/miatoll_defconfig') }}
          max-size: 2G

      - name: Cache Clang 18
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-r547379-${{ runner.os }}
          restore-keys: |
            clang-r547379-

      - name: Download Clang 18 (r547379 - Clang 18.1.0)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Clang 18..."
          rm -rf clang
          # Try primary crdroid
          if ! git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379 clang; then
            echo "Primary failed, trying LineageOS..."
            git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r547379 clang || \
            git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r530720 clang
          fi
          clang/bin/clang --version
          clang/bin/ld.lld --version

      - name: Verify Clang version
        run: |
          clang/bin/clang --version
          clang/bin/clang --version | grep -E "18\." || (echo "Clang 18 not found, but continuing" && clang/bin/clang --version)

      - name: Validate defconfig
        run: |
          export ARCH=arm64
          export PATH=$PWD/clang/bin:$PATH
          make O=out ARCH=arm64 vendor/xiaomi/miatoll_defconfig
          echo "=== Defconfig validation ==="
          grep -E "MODULE_SIG|KPROBES|BBR|F2FS|NTFS|BPF|FTRACE|SECURITYFS|KALLSYMS_ALL|SCHED_FQ|DEFAULT_BBR" out/.config | sort

      - name: Build Kernel with Pure Clang 18
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_HOST=android-build
          export KBUILD_BUILD_USER=kardebayan
          export PATH=$PWD/clang/bin:$PATH
          export USE_CCACHE=1
          ccache -M 2G || true

          echo "Starting build with Clang 18..."
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC="clang" \
            HOSTCC="clang" \
            HOSTCXX="clang++" \
            LD="ld.lld" \
            AR="llvm-ar" \
            NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" \
            OBJDUMP="llvm-objdump" \
            READELF="llvm-readelf" \
            STRIP="llvm-strip" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
            LLVM=1 \
            LLVM_IAS=1 \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            2>&1 | tee out/build.log

          echo "=== Build completed ==="
          ls -lh out/arch/arm64/boot/
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Image.gz found"
          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "Image found, compressing"
            gzip -k out/arch/arm64/boot/Image || true
          fi
          tail -n 100 out/build.log

      - name: Package with AnyKernel3
        run: |
          TANGGAL=$(date +"%Y%m%d-%H")
          echo "TANGGAL=$TANGGAL" >> $GITHUB_ENV
          ZIMAGE=out/arch/arm64/boot/Image.gz
          if [ ! -f "$ZIMAGE" ]; then
            ZIMAGE=out/arch/arm64/boot/Image
          fi
          if [ ! -f "$ZIMAGE" ]; then
            echo "Kernel image not found!"
            exit 1
          fi
          echo "Using image: $ZIMAGE"
          # Clone AnyKernel3
          if [ ! -d AnyKernel ]; then
            git clone --depth=1 https://github.com/Amritorock/AnyKernel3 -b r5x AnyKernel || \
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel
          fi
          cp $ZIMAGE AnyKernel/ || cp out/arch/arm64/boot/Image.gz AnyKernel/ || cp out/arch/arm64/boot/Image AnyKernel/
          # Copy dtb if exists
          if [ -f out/arch/arm64/boot/dtb ]; then
            cp out/arch/arm64/boot/dtb AnyKernel/ || true
          fi
          if [ -d out/arch/arm64/boot/dts ]; then
            find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} AnyKernel/ \; 2>/dev/null || true
          fi
          cd AnyKernel
          zip -r9 Stormbreaker-miatoll-${TANGGAL}.zip * -x .git README.md *placeholder
          ls -lh *.zip
          cd ..
          mkdir -p release
          cp AnyKernel/*.zip release/
          cp out/arch/arm64/boot/Image* release/ 2>/dev/null || true

      - name: Upload AnyKernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Stormbreaker-miatoll-${{ env.TANGGAL }}
          path: |
            AnyKernel/*.zip
            release/*.zip
          retention-days: 14

      - name: Upload Kernel Images
        uses: actions/upload-artifact@v4
        with:
          name: kernel-images-${{ env.TANGGAL }}
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtb
            out/build.log
          retention-days: 7

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed
          path: out/build.log
          retention-days: 3

  # Optional release job - only on manual dispatch or push to a branch with tag
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Stormbreaker-miatoll-*
          merge-multiple: true
          path: release/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
