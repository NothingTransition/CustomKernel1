name: Build Stormbreaker Kernel - Clang 18 Fast

# Cancel previous runs when new push happens - makes CI fast
concurrency:
  group: stormbreaker-miatoll-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - a
      - arena/**
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install deps (fast)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev ccache git zip python3 lld
          echo "Deps done"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-stormbreaker-${{ hashFiles('**/miatoll_defconfig') }}
          max-size: 3G
          save: true

      - name: Cache Clang 18
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-r547379-fast-${{ runner.os }}
          restore-keys: clang-r547379-

      - name: Download Clang 18 (fast)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          rm -rf clang
          echo "Downloading Clang 18.1.0 r547379..."
          # Fast clone with depth 1, single branch
          git clone --depth=1 --single-branch https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379 clang || \
          git clone --depth=1 --single-branch https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r547379 clang
          clang/bin/clang --version

      - name: Build Kernel - Pure Clang 18 Fast
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_HOST=android-build
          export KBUILD_BUILD_USER=kardebayan
          export PATH=$PWD/clang/bin:$PATH
          export USE_CCACHE=1
          export CCACHE_SLOPPINESS="pch_defines,time_macros"
          export CCACHE_COMPRESS=1
          ccache -M 3G
          ccache -z

          # Fast defconfig
          make O=out ARCH=arm64 vendor/xiaomi/miatoll_defconfig

          echo "=== Fast Clang 18 Build ==="
          # Use ccache + clang, LLVM=1 LLVM_IAS=1, no GCC
          # -j$(nproc) for speed, KCFLAGS for no debug
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            HOSTCXX="ccache clang++" \
            LD="ld.lld" \
            AR="llvm-ar" \
            NM="llvm-nm" \
            OBJCOPY="llvm-objcopy" \
            OBJDUMP="llvm-objdump" \
            STRIP="llvm-strip" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="aarch64-linux-gnu-" \
            CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
            LLVM=1 \
            LLVM_IAS=1 \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            KBUILD_BUILD_TIMESTAMP="$(date)" \
            2>&1 | tee out/build.log

          echo "=== Build stats ==="
          ccache -s
          ls -lh out/arch/arm64/boot/
          ls -lh out/arch/arm64/boot/Image* || true

      - name: Package AnyKernel3
        run: |
          TANGGAL=$(date +"%Y%m%d-%H")
          echo "TANGGAL=$TANGGAL" >> $GITHUB_ENV
          ZIMAGE=out/arch/arm64/boot/Image.gz
          [ -f "$ZIMAGE" ] || ZIMAGE=out/arch/arm64/boot/Image
          [ -f "$ZIMAGE" ] || (echo "No image!" && exit 1)
          echo "Image: $ZIMAGE $(du -h $ZIMAGE)"

          # Use local AnyKernel3 folder (already normalized)
          rm -rf AnyKernel
          cp -r AnyKernel3 AnyKernel
          cp $ZIMAGE AnyKernel/
          # Remove placeholder files from zip root if any
          rm -f AnyKernel/STRUCTURE.md 2>/dev/null || true

          cd AnyKernel
          zip -r9 Stormbreaker-miatoll-${TANGGAL}-Clang18-Fast.zip * -x .git README.md *placeholder .placeholder
          ls -lh *.zip
          cd ..

      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: Stormbreaker-miatoll-${{ env.TANGGAL }}-Clang18
          path: AnyKernel/*.zip
          retention-days: 7
          if-no-files-found: error

      - name: Upload Log on Fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/build.log
          retention-days: 3
